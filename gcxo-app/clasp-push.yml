name: clasp push

# Sube el código al proyecto de Apps Script al hacer push a `main`.
#
# ⚠️ NO crea versiones ni despliegues, y es a propósito. `appsscript.json` dice
# `executeAs: USER_DEPLOYING`: la app corre como QUIEN CREA EL DESPLIEGUE, y esa
# identidad es la que lee la hoja, escribe el turnero y manda los correos a los
# controladores. Si CI desplegara con otra cuenta, los avisos saldrían desde otra
# dirección y, si esa cuenta no tuviera acceso a la hoja, la app dejaría de
# funcionar entera. Crear versión y despliegue sigue siendo manual, y desde la
# cuenta propietaria del script.

on:
  push:
    branches: [main]
    # Solo lo que clasp sube (ver .claspignore, que es una lista blanca). El
    # patrón '*.js' cubre únicamente la raíz, así que tocar test/ no dispara
    # push — que es lo correcto: los tests no van al proyecto.
    paths:
      - 'appsscript.json'
      - '*.js'
      - '*.html'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/clasp-push.yml'
  workflow_dispatch:

concurrency:
  group: clasp-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Antes de tocar el proyecto. Si el motor o el cambio directo se rompen,
      # el script no llega a enterarse.
      - name: Tests
        run: node test/test.js

      # Pinado a la major 3: es la que lee el ~/.clasprc.json con la forma
      # {"tokens":{"default":{...}}} que genera `clasp login`. Si algún día se
      # cambia de major, el login local hay que rehacerlo con esa misma.
      - name: Instalar clasp
        run: npm install -g @google/clasp@3

      - name: Credenciales
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secret CLASPRC_JSON. Genéralo con 'clasp login'"
            echo "::error::y pégalo en Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      # --force: sin él, clasp pregunta por consola y el job se queda colgado.
      # clasp deja el proyecto IGUAL que lo que sube: lo que no esté en la lista
      # blanca de .claspignore se borraría del script. Por eso esa lista manda.
      - name: clasp push
        run: clasp push --force

      - name: Limpiar credenciales
        if: always()
        run: rm -f ~/.clasprc.json
