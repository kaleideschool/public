// ── Evaluaciones ───────────────────────────────────────────────────────────
// Pestaña aparte de la instrucción a propósito: llevan SU borrador y SU
// aprobación. Anotar una evaluación no puede obligar a aprobar un plan de
// instrucción, que es lo que pasaba cuando compartían pantalla.
function PanelEvaluacion(props) {
  const [d, setD] = React.useState(null);
  const [evs, setEvs] = React.useState([]);
  const [nuevaEv, setNuevaEv] = React.useState({ dia: '', franja: 'M', quien: '', conQuien: '' });
  const [msg, setMsg] = React.useState(null);
  const mes = props.mes;
  const cp = (o) => JSON.parse(JSON.stringify(o));

  function cargar(m, recarga) {
    const fn = recarga ? recargarCache : runCache;
    return fn('plan_' + (m || ''), function (r) {
      setD(r);
      // ⚠ `!= null`, no `||`: una lista vacía es truthy y ganaba a lo aprobado.
      setEvs(cp(r.borradorEvals != null ? r.borradorEvals : (r.evaluaciones || [])));
    }, 'getPlanInstruccion', m || '').catch(function (er) {
      setMsg({ ok: false, txt: String(er && er.message ? er.message : er) });
    });
  }
  React.useEffect(function () { cargar(props.mes); }, [props.mes]);

  if (!d) {
    return e('div', { className: 'tarjeta', style: { maxWidth: '980px', margin: '0 auto' } },
      msg ? e('div', { className: 'rojo' }, msg.txt) : e('p', { className: 'muted' }, 'Cargando…'));
  }

  const nombre = (cta) => (d.nombres || {})[cta] || cta;
  const evsAplicadas = (d.evaluaciones || []);
  const sucio = JSON.stringify(evs) !== JSON.stringify(evsAplicadas);

  function anadir() {
    if (!nuevaEv.dia || !nuevaEv.quien) { setMsg({ ok: false, txt: 'Elige al menos el día y quién evalúa.' }); return; }
    const ev = { dia: Number(nuevaEv.dia), franja: nuevaEv.franja, quien: nuevaEv.quien, conQuien: nuevaEv.conQuien };
    setEvs(function (o) {
      return o.filter(function (x) {
        return !(x.dia === ev.dia && x.franja === ev.franja && x.quien === ev.quien);
      }).concat([ev]).sort(function (a, b) { return a.dia - b.dia || (a.franja < b.franja ? -1 : 1); });
    });
    setNuevaEv({ dia: '', franja: 'M', quien: '', conQuien: '' });
    setMsg(null);
  }
  function quitar(i) {
    setEvs(function (o) { const x = o.slice(); x.splice(i, 1); return x; });
    setMsg(null);
  }
  function guardar() {
    run('guardarBorradorEvaluaciones', mes, evs).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo guardar.' }); return; }
      setMsg({ ok: true, txt: '✓ Borrador guardado. El turnero no se ha tocado.' });
    }).catch(function (er) { setMsg({ ok: false, txt: String(er && er.message ? er.message : er) }); });
  }
  function aprobar() {
    confirmar('Se anotan ' + evs.length + ' evaluaciones y se escribe EvM/EvT en el turnero a quien le falte, ' +
      'tanto al que evalúa como al evaluado.\n\n' +
      'A quien tenga otro código ese día (Ms, Mo…) NO se le pisa: se te dirá cuáles.',
      { titulo: 'Aprobar evaluaciones', ok: 'Aprobar' }).then(function (si) {
      if (!si) return;
      setMsg({ ok: true, txt: 'Escribiendo…' });
      run('aplicarEvaluaciones', mes, evs).then(function (r) {
        if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo aprobar.' }); return; }
        ['equipo_', 'global_', 'cal_', 'detalle_'].forEach(olvidarPrefijo);
        return cargar(mes, true).then(function () {
          setMsg({
            ok: true,
            txt: '✓ ' + r.celdas + ' celdas escritas.' +
              (r.respetadas.length ? ' Sin tocar (ya tenían otro turno): ' + r.respetadas.join(', ') + '.' : '')
          });
        });
      }).catch(function (er) { setMsg({ ok: false, txt: String(er && er.message ? er.message : er) }); });
    });
  }
  function descartar() {
    run('descartarBorradorEvaluaciones', mes).then(function (r) {
      setEvs(((r && r.evaluaciones) || []).slice());
      setMsg({ ok: true, txt: '✓ Borrador descartado.' });
    }).catch(function (er) { setMsg({ ok: false, txt: String(er && er.message ? er.message : er) }); });
  }

  return e('div', { className: 'tarjeta', style: { maxWidth: '980px', margin: '0 auto' } },
    e('h3', { style: { marginTop: 0 } }, '📋 Evaluación · ' + mes),
    e('p', { className: 'muted', style: { fontSize: '12px' } },
      'A mano: ni quién evalúa ni a quién se deduce de nada. Quién ', e('b', null, 'puede'), ' evaluar sale de la ' +
      'capacidad «Evaluar» de su puesto; a quién se evalúa puede ser cualquiera, alumnos incluidos. ' +
      'Al aprobar se escribe EvM/EvT a quien le falte, a los dos lados.'),
    msg && e('div', { className: msg.ok ? 'verde' : 'rojo', style: { margin: '8px 0' } }, msg.txt),

    d.puedeEditar && e('div', { className: 'fila' },
      e('button', { className: 'sec', disabled: !sucio, onClick: guardar }, '💾 Guardar borrador'),
      e('button', { className: 'accion', disabled: !sucio, onClick: aprobar }, '✓ Aprobar y enviar al turnero'),
      d.borradorEvals && e('button', { className: 'sec', onClick: descartar }, 'Descartar')),
    sucio
      ? e('p', { className: 'rojo', style: { fontSize: '12px', margin: '4px 0' } }, '● Hay cambios sin aprobar.')
      : e('p', { className: 'verde', style: { fontSize: '12px', margin: '4px 0' } }, '✓ Al día con el turnero.'),

    d.puedeEditar && e('div', { className: 'fila', style: { margin: '8px 0' } },
      e('select', { value: nuevaEv.dia, onChange: function (ev) { setNuevaEv(Object.assign({}, nuevaEv, { dia: ev.target.value })); } },
        e('option', { value: '' }, 'Día'),
        (d.dias || []).map(function (dd) { return e('option', { key: dd, value: dd }, dd); })),
      e('select', { value: nuevaEv.franja, onChange: function (ev) { setNuevaEv(Object.assign({}, nuevaEv, { franja: ev.target.value })); } },
        e('option', { value: 'M' }, 'Mañana'), e('option', { value: 'T' }, 'Tarde')),
      e('select', { value: nuevaEv.quien, onChange: function (ev) { setNuevaEv(Object.assign({}, nuevaEv, { quien: ev.target.value })); } },
        e('option', { value: '' }, 'Evalúa…'),
        (d.evaluadores || []).map(function (p) { return e('option', { key: p.cta, value: p.cta }, p.nombre + ' (' + p.cta + ')'); })),
      e('select', { value: nuevaEv.conQuien, onChange: function (ev) { setNuevaEv(Object.assign({}, nuevaEv, { conQuien: ev.target.value })); } },
        e('option', { value: '' }, 'A…'),
        (d.evaluables || []).map(function (p) { return e('option', { key: p.cta, value: p.cta }, p.nombre + ' (' + p.cta + ')'); })),
      e('button', { className: 'sec', onClick: anadir }, '+ Añadir')),

    (evs || []).length === 0
      ? e('p', { className: 'muted', style: { fontSize: '12px' } }, 'Ninguna evaluación programada este mes.')
      : e('table', { className: 'bal' },
          e('thead', null, e('tr', null,
            e('th', null, 'Día'), e('th', null, 'Franja'), e('th', null, 'Evalúa'), e('th', null, 'A'), e('th', null, ''))),
          e('tbody', null, evs.map(function (ev, i) {
            return e('tr', { key: i },
              e('td', null, e('b', null, ev.dia)),
              e('td', null, ev.franja === 'M' ? 'Mañana' : 'Tarde'),
              e('td', { style: { textAlign: 'left' } }, nombre(ev.quien)),
              e('td', { style: { textAlign: 'left' } }, ev.conQuien ? nombre(ev.conQuien) : '—'),
              e('td', null, d.puedeEditar && e('button', {
                className: 'sec', style: { fontSize: '11px', padding: '2px 6px' },
                onClick: function () { quitar(i); }
              }, '✕')));
          }))));
}

// ── Dotación: la necesaria y la existente, día a día ───────────────────────
// Dos columnas y los días en vertical. Cada una lleva el valor entero
// `controladores+supervisores+instructores`, que es como se piensa y como se
// escribe en el cuadrante.
function PanelDotacion(props) {
  const [d, setD] = React.useState(null);
  const [val, setVal] = React.useState(null);      // { M: {1:'4+1+1'}, T: {…} }
  const [msg, setMsg] = React.useState(null);
  const [editando, setEditando] = React.useState(false);
  const [soloFallos, setSoloFallos] = React.useState(false);
  const [nombrePl, setNombrePl] = React.useState('');
  const mes = props.mes;   // el de la cabecera, ver `Vista`

  function cargar(m, recarga) {
    const fn = recarga ? recargarCache : runCache;
    return fn('dotacion_' + (m || ''), function (r) {
      setD(r); setVal(desglosar(r));
    }, 'getDotacion', m || '').catch(function (er) {
      setMsg({ ok: false, txt: 'No se pudo cargar: ' + (er && er.message ? er.message : er) });
    });
  }
  React.useEffect(function () { setEditando(false); cargar(props.mes); }, [props.mes]);

  // En la hoja se guarda "4+1+1"; aquí se teclea un número por categoría.
  function desglosar(r) {
    const x = {};
    (r.franjas || ['M', 'T']).forEach(function (f) {
      x[f] = {};
      (r.dias || []).forEach(function (dia) {
        const p = partirTxt(((r.dotacion || {})[f] || {})[dia]);
        if (p) x[f][dia] = p;
      });
    });
    return x;
  }
  function partirTxt(txt) {
    const t = String(txt == null ? '' : txt).trim();
    if (!t || !/^\d+(\s*\+\s*\d+){0,2}$/.test(t)) return null;
    const p = t.split('+').map(function (x) { return parseInt(x, 10) || 0; });
    return { cta: p[0] || 0, sup: p[1] || 0, ins: p[2] || 0 };
  }

  if (!d || !val) {
    return e('div', { className: 'tarjeta', style: { maxWidth: '760px', margin: '0 auto' } },
      msg ? e('div', { className: 'rojo' }, msg.txt) : e('p', { className: 'muted' }, 'Cargando dotación…'));
  }

  const CATS = d.categorias || [];
  function juntar(o) {
    if (!o) return '';
    if (o.ins) return o.cta + '+' + o.sup + '+' + o.ins;
    if (o.sup) return o.cta + '+' + o.sup;
    return String(o.cta);
  }
  const pide = function (f, dia) { return (val[f] || {})[dia] || null; };
  const hay = function (f, dia) { return ((d.real || {})[f] || {})[dia] || { cta: 0, sup: 0, ins: 0, quien: {} }; };
  const hayTxt = function (f, dia) { return juntar(hay(f, dia)); };
  // 'falta' si alguna categoría se queda corta; 'sobra' si alguna pasa y
  // ninguna falta; 'justo' si cuadran las tres; null si no se pide nada.
  const estado = function (f, dia) {
    const p = pide(f, dia);
    if (!p) return null;
    const h = hay(f, dia);
    if (CATS.some(function (c) { return h[c.id] < p[c.id]; })) return 'falta';
    if (CATS.some(function (c) { return h[c.id] > p[c.id]; })) return 'sobra';
    return 'justo';
  };
  const diaFalla = function (dia) {
    return d.franjas.some(function (f) { return estado(f, dia) === 'falta'; });
  };

  function paraGuardar() {
    const o = {};
    d.franjas.forEach(function (f) {
      o[f] = {};
      d.dias.forEach(function (dia) { const p = pide(f, dia); if (p) o[f][dia] = juntar(p); });
    });
    return o;
  }
  function guardadoActual() {
    const o = {};
    d.franjas.forEach(function (f) {
      o[f] = {};
      d.dias.forEach(function (dia) {
        const v = ((d.dotacion || {})[f] || {})[dia];
        if (v) o[f][dia] = v;
      });
    });
    return o;
  }
  const sucio = JSON.stringify(paraGuardar()) !== JSON.stringify(guardadoActual());

  // Vaciar los controladores es la forma de decir «este día no se comprueba».
  function fijar(f, dia, cat, v) {
    const t = String(v).trim();
    const n = t === '' ? null : Math.max(0, parseInt(t, 10) || 0);
    setVal(function (o) {
      const x = JSON.parse(JSON.stringify(o));
      if (!x[f]) x[f] = {};
      if (n === null && cat === 'cta') { delete x[f][dia]; return x; }
      const actual = x[f][dia] || { cta: 0, sup: 0, ins: 0 };
      actual[cat] = n === null ? 0 : n;
      x[f][dia] = actual;
      return x;
    });
  }
  function volcar(datos, txt) {
    setVal(function (o) {
      const x = JSON.parse(JSON.stringify(o));
      d.franjas.forEach(function (f) {
        d.dias.forEach(function (dia) {
          const p = partirTxt((datos[f] || {})[dia]);
          if (p) x[f][dia] = p;
        });
      });
      return x;
    });
    setMsg({ ok: true, txt: txt + ' Revísalo y guarda.' });
  }
  function repetir(f) {
    const dia0 = d.dias.filter(function (dia) { return pide(f, dia); })[0];
    if (!dia0) { setMsg({ ok: false, txt: 'Rellena antes un día de esa franja.' }); return; }
    const modelo = pide(f, dia0);
    setVal(function (o) {
      const x = JSON.parse(JSON.stringify(o));
      d.dias.forEach(function (dia) { x[f][dia] = Object.assign({}, modelo); });
      return x;
    });
  }
  // Copia la dotación existente a la necesaria: el mes ya cuadrado es la mejor
  // plantilla que hay.
  function copiarDeLoQueHay() {
    setVal(function (o) {
      const x = JSON.parse(JSON.stringify(o));
      d.franjas.forEach(function (f) {
        d.dias.forEach(function (dia) {
          const h = hay(f, dia);
          if (h.cta || h.sup || h.ins) x[f][dia] = { cta: h.cta, sup: h.sup, ins: h.ins };
        });
      });
      return x;
    });
    setMsg({ ok: true, txt: 'Copiada la dotación existente. Revísala y guarda.' });
  }

  function guardar() {
    props.setCargando(true); setMsg(null);
    run('setDotacion', mes, paraGuardar()).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo guardar.' }); return; }
      setEditando(false);
      return cargar(mes, true).then(function () { setMsg({ ok: true, txt: '✓ Guardado.' }); });
    }).catch(function (er) {
      setMsg({ ok: false, txt: 'Error: ' + (er && er.message ? er.message : er) });
    }).finally(function () { props.setCargando(false); });
  }

  function guardarPlantilla() {
    const n = String(nombrePl || '').trim();
    if (!n) { setMsg({ ok: false, txt: 'Ponle un nombre a la plantilla.' }); return; }
    props.setCargando(true);
    run('guardarPlantillaDotacion', n, paraGuardar()).then(function () {
      setNombrePl('');
      return cargar(mes, true).then(function () { setMsg({ ok: true, txt: '✓ Plantilla «' + n + '» guardada.' }); });
    }).catch(function (er) { setMsg({ ok: false, txt: String(er && er.message ? er.message : er) }); })
      .finally(function () { props.setCargando(false); });
  }

  const nFallos = d.dias.filter(diaFalla).length;
  const dias = soloFallos ? d.dias.filter(diaFalla) : d.dias;
  const COLOR = { falta: 'var(--rojo)', sobra: '#b54708', justo: 'var(--verde)' };
  const MARCA = { falta: ' ▼', sobra: ' ▲', justo: '' };

  return e('div', { className: 'tarjeta', style: { maxWidth: '760px', margin: '0 auto' } },
    e('h3', { style: { marginTop: 0 } }, '👥 Dotación'),
    e('p', { className: 'muted', style: { fontSize: '12px' } },
      'Se teclea cuánta gente hace falta de cada tipo. Las dos últimas columnas salen solas: ',
      e('b', null, 'Requerida'), ' es lo que has puesto y ', e('b', null, 'Existente'),
      ' lo que hay en el cuadrante, con ', e('span', { className: 'rojo' }, '▼'), ' si falta. ' +
      'Dejar los controladores en blanco es decir que ese día no se comprueba.'),
    msg && e('div', { className: msg.ok ? 'verde' : 'rojo', style: { margin: '8px 0' } }, msg.txt),

    e('div', { className: 'fila' },
      !editando && e('button', { className: 'accion', onClick: function () { setMsg(null); setEditando(true); } }, '✏️ Editar'),
      editando && e('button', { className: 'accion', disabled: !sucio, onClick: guardar },
        sucio ? 'Guardar' : 'Sin cambios'),
      editando && e('button', {
        className: 'sec',
        onClick: function () { setVal(desglosar(d)); setEditando(false); setMsg(null); }
      }, 'Cancelar'),
      !editando && nFallos > 0 && e('button', {
        className: 'sec', onClick: function () { setSoloFallos(!soloFallos); }
      }, soloFallos ? ('Ver los ' + d.dias.length + ' días') : ('Solo los ' + nFallos + ' que fallan'))),

    !editando && e('p', { style: { fontSize: '12px' }, className: nFallos ? 'rojo' : 'verde' },
      nFallos ? (nFallos === 1 ? '1 día sin cubrir.' : nFallos + ' días sin cubrir.')
              : '✓ Todos los días declarados están cubiertos.'),

    editando && e('div', { className: 'fila', style: { marginTop: 6 } },
      e('button', { className: 'sec', onClick: copiarDeLoQueHay }, '⇤ Copiar la existente'),
      d.delCuadrante && e('button', {
        className: 'sec', title: 'Filas ' + (d.filasCuadrante || []).join(', ') + ' de la hoja del mes',
        onClick: function () { volcar(d.delCuadrante, 'Traída la fila DOTACIÓN del cuadrante.'); }
      }, '⤓ Traer del cuadrante'),
      d.franjas.map(function (f) {
        return e('button', { key: f, className: 'sec', onClick: function () { repetir(f); } },
          '⇢ Repetir en toda la ' + (f === 'M' ? 'mañana' : 'tarde'));
      }),
      (d.plantillas || []).map(function (p) {
        return e('button', {
          key: p.nombre, className: 'sec',
          onClick: function () { volcar(p.datos, 'Aplicada «' + p.nombre + '».'); }
        }, '▦ ' + p.nombre);
      })),

    e('div', { className: 'turnero-caja', style: { marginTop: 10 } },
      e('table', { className: 'tabla-turnero' },
        e('thead', null, e('tr', null,
          e('th', { className: 'col-cta' }, 'Día'),
          e('th', null, 'Franja'),
          CATS.map(function (c) { return e('th', { key: c.id, title: c.txt }, 'Nº ' + c.corto); }),
          e('th', { style: { borderLeft: '2px solid #d7dce3' },
                    title: 'Controladores + supervisores + instructores' }, 'Requerida'),
          e('th', { title: 'Lo que hay ahora mismo en el cuadrante' }, 'Existente'))),
        e('tbody', null, dias.map(function (dia) {
          return d.franjas.map(function (f, i) {
            const est = estado(f, dia);
            const quien = CATS.map(function (c) {
              const q = (hay(f, dia).quien || {})[c.id] || [];
              return q.length ? c.txt + ': ' + q.join(', ') : '';
            }).filter(Boolean).join(' · ');
            return e('tr', {
              key: dia + f,
              className: (est === 'falta' ? 'fila-sel' : '') + (i === 0 ? ' abre-grupo' : '')
            },
              e('td', { className: 'col-cta' }, i === 0 ? dia : ''),
              e('td', null, f === 'M' ? 'Mañana' : 'Tarde'),
              // Una columna por categoría: es donde se teclea.
              CATS.map(function (c) {
                const p = pide(f, dia);
                const falta = p && hay(f, dia)[c.id] < p[c.id];
                return e('td', { key: c.id },
                  editando
                    ? e('input', {
                        type: 'text', inputMode: 'numeric', value: p ? String(p[c.id]) : '',
                        style: { width: '34px', textAlign: 'center', padding: '2px' },
                        onChange: function (ev) { fijar(f, dia, c.id, ev.target.value); }
                      })
                    : (p ? e('span', { className: falta ? 'rojo' : '' }, String(p[c.id]))
                         : e('span', { className: 'muted' }, '·')));
              }),
              // Y las dos de resumen, que salen solas de lo anterior.
              e('td', { style: { borderLeft: '2px solid #d7dce3', fontWeight: 700 } },
                pide(f, dia) ? juntar(pide(f, dia)) : e('span', { className: 'muted' }, '—')),
              e('td', {
                title: quien || 'nadie ese día',
                style: { color: est ? COLOR[est] : undefined, fontWeight: est === 'justo' ? 400 : 700 }
              }, hayTxt(f, dia) + (est ? MARCA[est] : '')));
          });
        })))),

    editando && e('div', { className: 'fila', style: { marginTop: 10, borderTop: '1px solid var(--borde)', paddingTop: 10 } },
      e('span', { className: 'muted', style: { fontSize: '12px' } }, 'Guardar esto como plantilla:'),
      e('input', {
        type: 'text', value: nombrePl, placeholder: 'Verano', style: { width: '140px' },
        onChange: function (ev) { setNombrePl(ev.target.value); }
      }),
      e('button', { className: 'sec', onClick: guardarPlantilla }, 'Guardar plantilla')),

    e('p', { className: 'muted', style: { fontSize: '11px', marginTop: 8 } },
      'Pasa el ratón por la dotación existente para ver quién está. ',
      e('span', { className: 'rojo' }, '▼ falta'), ' · ',
      e('span', { style: { color: '#b54708' } }, '▲ sobra'), ' · en verde, cuadra.'));
}

// ── Colores del cuadrante ──────────────────────────────────────────────────
// Qué tono lleva cada marca al escribir. Se lee una vez de la hoja y se guarda;
// no se deduce en cada escritura, así se sabe qué se va a pintar.
function PanelColores(props) {
  const [d, setD] = React.useState(null);
  const [val, setVal] = React.useState(null);
  const [msg, setMsg] = React.useState(null);
  const [editando, setEditando] = React.useState(false);

  function cargar(recarga) {
    const fn = recarga ? recargarCache : runCache;
    return fn('paleta', function (r) {
      setD(r);
      setVal(Object.assign({}, r.paleta));
    }, 'getPaleta', '').catch(function (er) {
      setMsg({ ok: false, txt: 'No se pudo cargar: ' + (er && er.message ? er.message : er) });
    });
  }
  React.useEffect(function () { cargar(); }, []);

  if (!d || !val) {
    return e('div', { className: 'tarjeta', style: { maxWidth: '720px', margin: '0 auto' } },
      msg ? e('div', { className: 'rojo' }, msg.txt) : e('p', { className: 'muted' }, 'Cargando colores…'));
  }

  const sucio = d.marcas.some(function (m) { return (val[m.id] || '') !== (d.paleta[m.id] || ''); });

  function guardar() {
    props.setCargando(true); setMsg(null);
    run('setPaleta', val).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo guardar.' }); return; }
      setEditando(false);
      return cargar(true).then(function () { setMsg({ ok: true, txt: '✓ Guardado.' }); });
    }).catch(function (er) {
      setMsg({ ok: false, txt: 'Error: ' + (er && er.message ? er.message : er) });
    }).finally(function () { props.setCargando(false); });
  }

  function fijar(id, v) {
    setVal(function (o) { const x = Object.assign({}, o); x[id] = v; return x; });
  }
  // `input type=color` exige un #rrggbb válido; si lo escrito aún no lo es,
  // se le da blanco en vez de dejar la rueda en un estado indefinido.
  function hexSeguro(v) {
    const h = String(v == null ? '' : v).trim().toLowerCase().replace('#', '');
    if (/^[0-9a-f]{3}$/.test(h)) return '#' + h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return /^[0-9a-f]{6}$/.test(h) ? '#' + h : '#ffffff';
  }

  const muestra = function (hex) {
    return e('span', { style: {
      display: 'inline-block', width: 16, height: 16, borderRadius: 3,
      border: '1px solid #d7dce3', background: hex || '#ffffff', verticalAlign: '-3px'
    } });
  };

  return e('div', { className: 'tarjeta', style: { maxWidth: '720px', margin: '0 auto' } },
    e('h3', { style: { marginTop: 0 } }, '🎨 Colores del cuadrante'),
    e('p', { className: 'muted', style: { fontSize: '12px' } },
      'El fondo de la celda no es decoración: por él se sabe si una M es una extra, una voluntaria ' +
      'o una imaginaria activada. Estos son los tonos que escribe la app.'),
    msg && e('div', { className: msg.ok ? 'verde' : 'rojo', style: { margin: '8px 0' } }, msg.txt),

    e('table', { className: 'bal', style: { marginTop: 8 } },
      e('thead', null, e('tr', null,
        e('th', null, 'Marca'), e('th', null, 'Color que escribe la app'))),
      e('tbody', null, d.marcas.map(function (m) {
        return e('tr', { key: m.id },
          e('td', { style: { textAlign: 'left' } }, m.txt,
            m.ayuda && e('span', { className: 'muted', style: { fontSize: '11px' } }, ' · ' + m.ayuda)),
          e('td', { style: { whiteSpace: 'nowrap' } },
            editando
              ? e('span', null,
                  // La rueda del navegador y el código, sincronizados: se puede
                  // pinchar el color o pegar el hex, lo que venga mejor.
                  e('input', {
                    type: 'color', value: hexSeguro(val[m.id]),
                    style: {
                      width: 34, height: 26, padding: 0, cursor: 'pointer',
                      border: '1px solid var(--borde)', borderRadius: 4, verticalAlign: '-7px'
                    },
                    onChange: function (ev) { fijar(m.id, ev.target.value); }
                  }), ' ',
                  e('input', {
                    type: 'text', value: val[m.id] || '', style: { width: '86px' },
                    onChange: function (ev) { fijar(m.id, ev.target.value); }
                  }))
              : e('span', null, muestra(val[m.id]), ' ', e('code', null, val[m.id] || '—'))));
      }))),

    e('div', { className: 'fila', style: { marginTop: 14 } },
      editando
        ? e('button', { className: 'accion', disabled: !sucio, onClick: guardar }, sucio ? 'Guardar' : 'Sin cambios')
        : e('button', { className: 'accion', onClick: function () { setMsg(null); setEditando(true); } }, '✏️ Editar'),
      editando && e('button', { className: 'sec', onClick: function () { setVal(Object.assign({}, d.paleta)); setEditando(false); setMsg(null); } }, 'Cancelar'),
      editando && e('button', {
        className: 'sec',
        onClick: function () {
          confirmar('Vuelven los colores de fábrica.', { titulo: 'Restaurar', ok: 'Restaurar', peligro: true })
            .then(function (si) {
              if (!si) return;
              props.setCargando(true);
              run('restaurarPaleta').then(function () { setEditando(false); return cargar(true); })
                .finally(function () { props.setCargando(false); });
            });
        }
      }, 'Restaurar de fábrica')));
}

// ── Permisos: qué pestañas ve cada perfil ──────────────────────────────────
// Es VISIBILIDAD, no seguridad: cada función del servidor sigue exigiendo su
// rol. Marcar una casilla que el rol no puede usar enseña la pantalla y nada
// más, así que esas van avisadas.
function PanelPermisos(props) {
  const [d, setD] = React.useState(null);
  const [sel, setSel] = React.useState(null);      // rol → [ids]
  const [msg, setMsg] = React.useState(null);
  const [editando, setEditando] = React.useState(false);
  // Alta de perfil y, aparte, el que se esté renombrando.
  const [nuevo, setNuevo] = React.useState({ nombre: '', copiarDe: '', desc: '' });
  const [editPerfil, setEditPerfil] = React.useState(null);   // { orig, nombre, desc }

  React.useEffect(function () {
    runCache('permisos', function (r) {
      setD(r);
      setSel(JSON.parse(JSON.stringify(r.permisos)));
    }, 'getPermisos').catch(function (er) {
      setMsg({ ok: false, txt: 'No se pudieron cargar: ' + (er && er.message ? er.message : er) });
    });
  }, []);

  function recargar(txt) {
    return recargarCache('permisos', function (r2) {
      setD(r2); setSel(JSON.parse(JSON.stringify(r2.permisos)));
    }, 'getPermisos').then(function () { if (txt) setMsg({ ok: true, txt: txt }); });
  }

  if (!d || !sel) {
    return e('div', { className: 'tarjeta', style: { maxWidth: '980px', margin: '0 auto' } },
      msg ? e('div', { className: 'rojo' }, msg.txt) : e('p', { className: 'muted' }, 'Cargando permisos…'));
  }

  const perfiles = d.perfiles || (d.roles || []).map(function (r) {
    return { nombre: r, desc: '', personas: 0, defecto: false };
  });

  const marcado = function (rol, id) { return (sel[rol] || []).indexOf(id) !== -1; };
  const sucio = d.roles.some(function (rol) {
    const a = (sel[rol] || []).slice().sort().join('|');
    const b = (d.permisos[rol] || []).slice().sort().join('|');
    return a !== b;
  });
  // Ya no hay casillas «imposibles» que avisar: la vista ES el permiso, así que
  // marcarla lo concede de verdad. La ⚠ de antes existía porque el servidor
  // exigía un rol por su nombre y la casilla podía no servir de nada.
  // Lo único que sigue haciendo falta señalar es la que nadie puede perder.
  const irrenunciable = function (rol, id) {
    if (id !== d.irrenunciable) return false;
    const otros = d.roles.filter(function (r) { return r !== rol && (sel[r] || []).indexOf(id) !== -1; });
    return !otros.length || rol === d.miPerfil;
  };

  function crear() {
    if (!nuevo.nombre.trim()) { setMsg({ ok: false, txt: 'Ponle nombre al perfil.' }); return; }
    props.setCargando(true); setMsg(null);
    run('crearPerfil', nuevo.nombre, nuevo.desc, nuevo.copiarDe).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo crear.' }); return; }
      const de = nuevo.copiarDe;
      setNuevo({ nombre: '', copiarDe: '', desc: '' });
      return recargar('✓ Perfil ' + r.nombre + ' creado' +
        (de ? ', con las ' + r.vistas + ' vistas de ' + de + '. Ajústalas abajo.'
            : '. Todavía no ve NADA: márcale sus vistas abajo.'));
    }).catch(function (er) {
      setMsg({ ok: false, txt: 'Error: ' + (er && er.message ? er.message : er) });
    }).finally(function () { props.setCargando(false); });
  }

  function guardarPerfil() {
    const p = editPerfil;
    props.setCargando(true); setMsg(null);
    run('editarPerfil', p.orig, { nombre: p.nombre, desc: p.desc }).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo guardar.' }); return; }
      setEditPerfil(null);
      return recargar('✓ Perfil guardado' +
        (r.movidos ? '. Se le ha cambiado el perfil a ' + r.movidos + ' persona(s).' : '.'));
    }).catch(function (er) {
      setMsg({ ok: false, txt: 'Error: ' + (er && er.message ? er.message : er) });
    }).finally(function () { props.setCargando(false); });
  }

  function ponerDefecto(p) {
    props.setCargando(true); setMsg(null);
    run('setPerfilDefecto', p.nombre).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo.' }); return; }
      return recargar('✓ ' + p.nombre + ' es ahora el perfil por defecto.');
    }).catch(function (er) {
      setMsg({ ok: false, txt: 'Error: ' + (er && er.message ? er.message : er) });
    }).finally(function () { props.setCargando(false); });
  }

  function borrar(p) {
    confirmar('Se borra el perfil ' + p.nombre + ' y sus permisos.' +
      (p.personas ? '\n\n⚠ Lo tienen ' + p.personas + ' persona(s): habrá que cambiárselo antes.' : ''),
      { titulo: 'Borrar perfil', ok: 'Borrar', peligro: true }).then(function (si) {
      if (!si) return;
      props.setCargando(true); setMsg(null);
      run('borrarPerfil', p.nombre).then(function (r) {
        if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo borrar.' }); return; }
        return recargar('✓ Perfil ' + p.nombre + ' borrado.');
      }).catch(function (er) {
        setMsg({ ok: false, txt: 'Error: ' + (er && er.message ? er.message : er) });
      }).finally(function () { props.setCargando(false); });
    });
  }

  function alternar(rol, id) {
    setSel(function (o) {
      const n = JSON.parse(JSON.stringify(o));
      const i = n[rol].indexOf(id);
      if (i === -1) n[rol].push(id); else n[rol].splice(i, 1);
      return n;
    });
  }

  function guardar() {
    props.setCargando(true); setMsg(null);
    run('setPermisos', sel).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo guardar.' }); return; }
      setEditando(false);
      return recargarCache('permisos', function (r2) { setD(r2); setSel(JSON.parse(JSON.stringify(r2.permisos))); }, 'getPermisos')
        .then(function () { setMsg({ ok: true, txt: '✓ Guardado. Cada uno lo verá al recargar la app.' }); });
    }).catch(function (er) {
      setMsg({ ok: false, txt: 'Error al guardar: ' + (er && er.message ? er.message : er) });
    }).finally(function () { props.setCargando(false); });
  }

  function cancelar() {
    if (!sucio) { setEditando(false); setMsg(null); return; }
    confirmar('Has cambiado permisos y no los has guardado.',
              { titulo: 'Descartar cambios', ok: 'Descartar', peligro: true }).then(function (si) {
      if (!si) return;
      setSel(JSON.parse(JSON.stringify(d.permisos))); setEditando(false); setMsg(null);
    });
  }

  function restaurar() {
    confirmar('Los tres perfiles de la semilla (CTA, VALIDADOR, ADMIN) vuelven a sus ' +
              'pantallas de fábrica. Los que hayas creado tú se quedan como están: no ' +
              'tienen «fábrica» a la que volver.',
              { titulo: 'Restaurar permisos', ok: 'Restaurar', peligro: true }).then(function (si) {
      if (!si) return;
      props.setCargando(true); setMsg(null);
      run('restaurarPermisos').then(function () {
        setEditando(false);
        return recargarCache('permisos', function (r2) { setD(r2); setSel(JSON.parse(JSON.stringify(r2.permisos))); }, 'getPermisos')
          .then(function () { setMsg({ ok: true, txt: '✓ Restaurados.' }); });
      }).catch(function (er) {
        setMsg({ ok: false, txt: 'Error: ' + (er && er.message ? er.message : er) });
      }).finally(function () { props.setCargando(false); });
    });
  }

  // Las vistas, agrupadas por la pestaña que las contiene.
  const grupos = [];
  d.vistas.forEach(function (v) {
    const g = grupos.filter(function (x) { return x.nombre === v.grupo; })[0];
    if (g) g.items.push(v); else grupos.push({ nombre: v.grupo, items: [v] });
  });

  return e('div', { className: 'tarjeta', style: { maxWidth: '980px', margin: '0 auto' } },
    e('h3', { style: { marginTop: 0 } }, '🔑 Perfiles y permisos'),
    e('p', { className: 'muted', style: { fontSize: '12px' } },
      'Un perfil es un nombre y una lista de pantallas. ',
      e('b', null, 'La pantalla ES el permiso'), ': marcarla concede de verdad lo que se hace en ella, ' +
      'y quitarla lo quita. Puedes borrar cualquier perfil y crear otro con las mismas pantallas — ' +
      'la app no conoce ningún nombre de perfil.'),
    msg && e('div', { className: msg.ok ? 'verde' : 'rojo', style: { margin: '8px 0' } }, msg.txt),

    // ── Los perfiles ────────────────────────────────────────────────────────
    e('div', { style: { marginBottom: 16 } },
      e('b', { style: { fontSize: '13px' } }, 'Perfiles de acceso'),
      e('p', { className: 'muted', style: { fontSize: '11px', margin: '2px 0 6px' } },
        'El marcado ', e('b', null, '★ por defecto'), ' es al que cae quien tenga la casilla «rol_app» ' +
        'en blanco, o un perfil que ya no exista. Siempre tiene que haber uno, y siempre tiene que ' +
        'quedar alguien con «Permisos»: es la única puerta desde la que se puede rectificar.'),
      e('table', { className: 'bal' },
        e('thead', null, e('tr', null,
          e('th', { style: { textAlign: 'left' } }, 'Perfil'),
          e('th', { style: { textAlign: 'left' } }, 'Para qué'),
          e('th', null, 'Pantallas'),
          e('th', null, 'Personas'),
          e('th', null, ''))),
        e('tbody', null, perfiles.map(function (p) {
          const ed = editPerfil && editPerfil.orig === p.nombre;
          return e('tr', { key: p.nombre },
            e('td', { style: { textAlign: 'left' } },
              ed ? e('input', {
                    value: editPerfil.nombre, style: { width: '120px' },
                    onChange: function (ev) { setEditPerfil(Object.assign({}, editPerfil, { nombre: ev.target.value.toUpperCase() })); }
                  })
                 : e('span', null,
                     e('b', null, p.nombre),
                     p.nombre === d.miPerfil && e('span', { className: 'muted', style: { fontSize: '10px' } }, ' · el tuyo'),
                     p.defecto && e('div', { className: 'muted', style: { fontSize: '10px' } }, '★ por defecto'))),
            e('td', { style: { textAlign: 'left', fontSize: '11px' }, className: 'muted' },
              ed ? e('input', {
                    value: editPerfil.desc, style: { width: '100%' },
                    onChange: function (ev) { setEditPerfil(Object.assign({}, editPerfil, { desc: ev.target.value })); }
                  })
                 : (p.desc || '—')),
            e('td', null, (sel[p.nombre] || []).length),
            e('td', null, p.personas),
            e('td', { style: { whiteSpace: 'nowrap' } },
              ed
                ? e('span', null,
                    e('button', { className: 'accion', style: { fontSize: '11px', padding: '2px 6px' }, onClick: guardarPerfil }, '✓'),
                    e('button', { className: 'sec', style: { fontSize: '11px', padding: '2px 6px' }, onClick: function () { setEditPerfil(null); } }, '✕'))
                : e('span', null,
                    e('button', {
                      className: 'sec', style: { fontSize: '11px', padding: '2px 6px' },
                      title: 'Renombrar (se le cambia a quien lo tenga) o cambiar la descripción',
                      onClick: function () { setMsg(null); setEditPerfil({ orig: p.nombre, nombre: p.nombre, desc: p.desc || '' }); }
                    }, '✏️'),
                    !p.defecto && e('button', {
                      className: 'sec', style: { fontSize: '11px', padding: '2px 6px' },
                      title: 'Hacerlo el perfil por defecto',
                      onClick: function () { ponerDefecto(p); }
                    }, '★'),
                    e('button', {
                      className: 'sec', style: { fontSize: '11px', padding: '2px 6px' },
                      title: p.personas ? 'Lo tienen ' + p.personas + ' persona(s): habrá que cambiárselo antes'
                                        : (p.defecto ? 'Es el perfil por defecto' : 'Borrar'),
                      onClick: function () { borrar(p); }
                    }, '🗑'))));
        }))),
      e('div', { className: 'fila', style: { marginTop: 8 } },
        e('input', {
          value: nuevo.nombre, placeholder: 'NOMBRE_NUEVO', style: { width: '150px' },
          onChange: function (ev) { setNuevo(Object.assign({}, nuevo, { nombre: ev.target.value.toUpperCase() })); }
        }),
        // Copiar de otro es lo que se quiere casi siempre: «como ese, pero sin
        // esto». Empezar en blanco deja un perfil que no ve ni la Guía.
        e('select', {
          value: nuevo.copiarDe,
          onChange: function (ev) { setNuevo(Object.assign({}, nuevo, { copiarDe: ev.target.value })); }
        }, e('option', { value: '' }, 'sin ninguna pantalla'),
           perfiles.map(function (p) { return e('option', { key: p.nombre, value: p.nombre }, 'copiando de ' + p.nombre); })),
        e('input', {
          value: nuevo.desc, placeholder: 'para qué es', style: { flex: 1, minWidth: '160px' },
          onChange: function (ev) { setNuevo(Object.assign({}, nuevo, { desc: ev.target.value })); }
        }),
        e('button', { className: 'sec', onClick: crear }, '+ Crear perfil'))),

    e('b', { style: { fontSize: '13px' } }, 'Qué puede hacer cada uno'),
    e('table', { className: 'bal' },
      e('thead', null, e('tr', null,
        e('th', null, 'Pantalla'),
        d.roles.map(function (r) {
          return e('th', { key: r }, r,
            r === d.miPerfil && e('div', { className: 'muted', style: { fontSize: '9px', fontWeight: 400 } }, 'el tuyo'));
        }))),
      e('tbody', null, grupos.map(function (g) {
        return [
          g.nombre && e('tr', { key: 'g-' + g.nombre },
            e('td', { colSpan: 1 + d.roles.length, style: { background: '#f0f0f0', textAlign: 'left' } },
              e('b', null, g.nombre))),
          g.items.map(function (v) {
            return e('tr', { key: v.id },
              e('td', { style: { textAlign: 'left' } },
                v.txt,
                v.nota && e('span', { className: 'muted', title: v.nota, style: { marginLeft: 4 } }, 'ⓘ')),
              d.roles.map(function (rol) {
                // La única casilla que no se puede desmarcar: la última copia
                // de «Permisos», y la tuya propia. Todo lo demás es libre —
                // marcar concede y desmarcar quita, sin letra pequeña.
                const fijo = marcado(rol, v.id) && irrenunciable(rol, v.id);
                return e('td', { key: rol, title: fijo
                    ? (rol === d.miPerfil
                        ? 'Es tu perfil: quitártela te dejaría fuera de esta pantalla.'
                        : 'Es el único perfil que la tiene: sería una puerta cerrada por dentro.')
                    : '' },
                  e('input', {
                    type: 'checkbox', checked: marcado(rol, v.id),
                    disabled: !editando || fijo,
                    onChange: function () { alternar(rol, v.id); }
                  }));
              }));
          })
        ];
      }))),

    e('div', { className: 'fila', style: { marginTop: 14 } },
      editando
        ? e('button', { className: 'accion', disabled: !sucio, onClick: guardar }, sucio ? 'Guardar cambios' : 'Sin cambios')
        : e('button', { className: 'accion', onClick: function () { setMsg(null); setEditando(true); } }, '✏️ Editar'),
      editando && e('button', { className: 'sec', onClick: cancelar }, 'Cancelar'),
      editando && e('button', { className: 'sec', onClick: restaurar }, 'Restaurar de fábrica')));
}

// ── Parámetros de cómputo: las cifras del convenio ─────────────────────────
// No viven en el código: viven en properties. El motor solo trae una semilla
// para poder sembrarlas la primera vez, igual que con la hoja PUESTOS.
function PanelParametros(props) {
  const [datos, setDatos] = React.useState(null);
  const [val, setVal] = React.useState(null);     // lo que hay escrito en los campos
  const [msg, setMsg] = React.useState(null);
  // Bloqueado de entrada. Son las cifras con las que se decide si un cambio es
  // legal: no deberían poder tocarse con el ratón de paso.
  const [editando, setEditando] = React.useState(false);

  React.useEffect(function () {
    runCache('parametros', function (r) {
      setDatos(r);
      setVal(_aTexto(r));
    }, 'getParametros').catch(function (er) {
      setMsg({ ok: false, txt: 'No se pudieron cargar: ' + (er && er.message ? er.message : er) });
    });
  }, []);

  // Minutos desde medianoche ⇄ "HH:MM". Los campos de hora se editan escritos,
  // que es como los tiene todo el mundo en la cabeza, y viajan en minutos.
  function aHora(min) {
    const m = Math.max(0, Math.round(Number(min) || 0));
    const h = Math.floor(m / 60), r = m % 60;
    return (h < 10 ? '0' : '') + h + ':' + (r < 10 ? '0' : '') + r;
  }
  function deHora(txt) {
    const t = String(txt == null ? '' : txt).trim().replace(/[.,]/g, ':');
    const m = t.match(/^(\d{1,2}):?(\d{2})$/);
    if (!m) return null;
    const h = Number(m[1]), mi = Number(m[2]);
    if (h > 23 || mi > 59) return null;
    return h * 60 + mi;
  }
  // Aquí se escribe "3,5", no "3.5": se pinta con coma y se acepta con coma.
  function aCifra(n) { return String(n).replace('.', ','); }
  function deCifra(txt) { return Number(String(txt == null ? '' : txt).trim().replace(',', '.')); }
  function _aTexto(d) {
    const horas = d.horas || [];
    const o = {};
    Object.keys(d.valores).forEach(function (k) {
      o[k] = horas.indexOf(k) !== -1 ? aHora(d.valores[k]) : aCifra(d.valores[k]);
    });
    return o;
  }

  if (!datos || !val) {
    return e('div', { className: 'tarjeta', style: { maxWidth: '780px', margin: '0 auto' } },
      msg && e('div', { className: 'rojo' }, msg.txt),
      !msg && e('p', { className: 'muted' }, 'Cargando parámetros…'));
  }

  const horas = datos.horas || [];
  const esHora = function (id) { return horas.indexOf(id) !== -1; };
  const aNumero = function (id) { return esHora(id) ? deHora(val[id]) : deCifra(val[id]); };

  const sucio = Object.keys(datos.valores).some(function (k) {
    const v = aNumero(k);
    return v === null || isNaN(v) || v !== datos.valores[k];
  });
  const invalido = Object.keys(datos.valores).some(function (k) {
    const v = aNumero(k);
    return v === null || isNaN(v) || v < 0;
  });
  const distintoDeSemilla = function (k) { return Number(datos.valores[k]) !== Number(datos.semilla[k]); };

  function hm(min) {
    if (min == null) return '—';
    const m = Math.round(min), h = Math.floor(m / 60), r = m % 60;
    return h + ':' + (r < 10 ? '0' : '') + r;
  }

  function recargar(txt) {
    return recargarCache('parametros', function (r2) {
      setDatos(r2); setVal(_aTexto(r2));
      if (txt) setMsg({ ok: true, txt: txt });
    });
  }

  function guardar() {
    const payload = {};
    let malo = null;
    Object.keys(datos.valores).forEach(function (k) {
      const v = aNumero(k);
      if (v === null || isNaN(v)) { malo = malo || k; return; }
      payload[k] = v;
    });
    if (malo) { setMsg({ ok: false, txt: 'Hay un valor que no se entiende. Revisa el campo marcado en rojo.' }); return; }

    props.setCargando(true); setMsg(null);
    run('setParametros', payload).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo guardar.' }); return; }
      setEditando(false);
      return recargar('✓ Guardado. Se aplica de inmediato a todas las validaciones.');
    }).catch(function (er) {
      setMsg({ ok: false, txt: 'Error al guardar: ' + (er && er.message ? er.message : er) });
    }).finally(function () { props.setCargando(false); });
  }

  function cancelar() {
    if (!sucio) { setEditando(false); setMsg(null); return; }
    confirmar('Has cambiado valores y no los has guardado. Si sales ahora se pierden.',
              { titulo: 'Descartar cambios', ok: 'Descartar', peligro: true }).then(function (si) {
      if (!si) return;
      setVal(_aTexto(datos)); setEditando(false); setMsg(null);
    });
  }

  function restaurar() {
    confirmar('Se sobreescriben TODOS los parámetros con los valores del convenio ' +
              'que trae el código, y se pierde lo que hayas ajustado.\n\n' +
              'Afecta a las validaciones desde este mismo momento.',
              { titulo: 'Volver a los valores del convenio', ok: 'Sobreescribir', peligro: true }).then(function (si) {
      if (!si) return;
      props.setCargando(true); setMsg(null);
      run('restaurarParametros').then(function () {
        setEditando(false);
        return recargar('✓ Restaurados los valores del convenio.');
      }).catch(function (er) {
        setMsg({ ok: false, txt: 'Error: ' + (er && er.message ? er.message : er) });
      }).finally(function () { props.setCargando(false); });
    });
  }

  const hayAjustes = Object.keys(datos.valores).some(distintoDeSemilla);

  return e('div', { className: 'tarjeta', style: { maxWidth: '780px', margin: '0 auto' } },
    e('h3', { style: { marginTop: 0 } }, '⚖️ Parámetros de cómputo'),
    e('p', { className: 'muted', style: { fontSize: '12px' } },
      'Con estas cifras se decide si un cambio es legal. Se aplican en cuanto las guardas; ' +
      'los cambios ya validados conservan el chequeo con el que se aprobaron.'),
    hayAjustes && e('p', { className: 'verde', style: { fontSize: '12px' } }, '● Hay valores ajustados; van marcados.'),
    (datos.recienSembradas && datos.recienSembradas.length)
      ? e('div', { className: 'aviso-legal', style: { fontSize: '12px' } },
          'Se han creado ' + datos.recienSembradas.length + ' parámetros que aún no existían, ' +
          'con su valor del convenio. Revísalos antes de dar nada por bueno.')
      : null,

    msg && e('div', { className: msg.ok ? 'verde' : 'rojo', style: { margin: '8px 0' } }, msg.txt),

    datos.meta.map(function (g) {
      return e('div', { key: g.grupo, style: { marginTop: 16 } },
        e('div', { style: { display: 'flex', alignItems: 'baseline', gap: '8px', flexWrap: 'wrap' } },
          e('b', null, g.grupo),
          e('span', { className: 'muted', style: { fontSize: '11px' } }, g.norma)),
        g.ventanas && e('p', { className: 'muted', style: { fontSize: '11px', margin: '4px 0 0' } },
          'La duración es la salida menos la entrada: mover una ventana recalcula el cómputo y los descansos.'),
        g.campos.some(function (c) { return c.pendiente; }) &&
          e('div', { className: 'aviso-legal', style: { fontSize: '12px', margin: '6px 0' } },
            'Los ⏳ están a cero y sin aplicar: falta confirmarlos.'),
        e('table', { className: 'bal', style: { marginTop: 6 } },
          e('tbody', null, g.campos.map(function (c) {
            const v = aNumero(c.id);
            const mal = v === null || isNaN(v) || v < 0;
            return e('tr', { key: c.id },
              e('td', { style: { width: '36%' } },
                c.pendiente && e('span', { title: 'Pendiente de confirmar: está a cero y no se aplica' }, '⏳ '),
                c.etiqueta,
                distintoDeSemilla(c.id) && e('span', {
                  className: 'verde', style: { marginLeft: 6 },
                  title: 'En el convenio: ' + (esHora(c.id) ? aHora(datos.semilla[c.id]) : aCifra(datos.semilla[c.id]))
                }, '●')),
              e('td', { style: { width: '110px', whiteSpace: 'nowrap' } },
                editando
                  ? e('input', {
                      type: 'text', inputMode: esHora(c.id) ? 'text' : 'decimal',
                      value: val[c.id], placeholder: esHora(c.id) ? 'HH:MM' : '',
                      style: {
                        width: esHora(c.id) ? '68px' : '62px', textAlign: 'right',
                        borderColor: mal ? 'var(--rojo)' : undefined,
                        color: mal ? 'var(--rojo)' : undefined
                      },
                      onChange: function (ev) {
                        const nv = ev.target.value;
                        setVal(function (o) { const n = Object.assign({}, o); n[c.id] = nv; return n; });
                      }
                    })
                  : e('b', { style: { display: 'inline-block', width: '62px', textAlign: 'right' } }, val[c.id]),
                e('span', { className: 'muted', style: { marginLeft: 4 } }, c.unidad || '')),
              e('td', { className: 'muted', style: { textAlign: 'left', fontSize: '11px' } }, c.ayuda || ''));
          }))));
    }),

    e('div', { className: 'fila', style: { marginTop: 16 } },
      editando
        ? e('button', { className: 'accion', disabled: !sucio || invalido, onClick: guardar },
            invalido ? 'Hay algo mal escrito' : (sucio ? 'Guardar cambios' : 'Sin cambios'))
        : e('button', { className: 'accion', onClick: function () { setMsg(null); setEditando(true); } }, '✏️ Editar'),
      editando && e('button', { className: 'sec', onClick: cancelar }, 'Cancelar'),
      editando && e('button', { className: 'sec', disabled: !hayAjustes, onClick: restaurar }, 'Volver a los del convenio')),


    // El efecto, para no tener que echar la cuenta de cabeza.
    e('div', { style: { marginTop: 20 } },
      e('b', null, 'Con estos valores, cada turno queda así'),
      e('table', { className: 'bal', style: { marginTop: 6 } },
        e('thead', null, e('tr', null,
          e('th', null, 'Código'), e('th', null, 'Ventana'), e('th', null, 'Minutos'), e('th', null, 'h:mm'),
          e('th', { title: 'Si la prolongación del horario operativo se efectúa ese día' }, 'Con PPR'),
          e('th', { title: 'Solo las imaginarias: lo que valdrían si se activaran' }, 'Si se activa'))),
        e('tbody', null, (datos.computos || []).map(function (c) {
          return e('tr', { key: c.codigo },
            e('td', null, e('b', null, c.codigo)),
            e('td', { className: 'muted' }, aHora(c.inicio) + '–' + aHora(c.fin)),
            e('td', null, c.minutos),
            e('td', { className: 'muted' }, hm(c.minutos)),
            e('td', { className: c.conPPR ? '' : 'muted' }, c.conPPR ? c.conPPR + ' (' + hm(c.conPPR) + ')' : '—'),
            e('td', { className: c.minutosMax ? '' : 'muted' }, c.minutosMax ? c.minutosMax + ' (' + hm(c.minutosMax) + ')' : '—'));
        }))),
      e('p', { className: 'muted', style: { fontSize: '11px', marginTop: 6 } },
        '«Con PPR» es lo que computaría si la prolongación se efectuara. Hoy no se registra, así que el motor usa la base.'))
  );
}

// ── Puestos y competencias: qué puede hacer cada puesto del turnero ────────
// Sustituye a la tabla que estaba escrita en el motor. Lo que se declare aquí
// manda sobre quién puede recibir un Ms/Ts o un Mo/To y quién queda fuera del
// circuito de cambios.
function PanelPuestos(props) {
  const [datos, setDatos] = React.useState(null);
  const [msg, setMsg] = React.useState(null);
  const [sucio, setSucio] = React.useState(false);
  // Lo que cada uno ya tenía marcado en la hoja ANTES de este reparto. El
  // resumen del servidor viene con las asignaciones de la tirada ya sumadas,
  // así que se le restan una vez y a partir de ahí se cuenta en vivo: si
  // quitas una asignación a mano, su contador baja al momento.
  const [base, setBase] = React.useState({});

  React.useEffect(function () {
    runCache('puestos', setDatos, 'getPuestos').catch(function (e) {
      setMsg({ ok: false, txt: 'No se pudieron cargar los puestos: ' + (e && e.message ? e.message : e) });
    });
  }, []);

  if (!datos) return e('p', { className: 'muted' }, 'Cargando puestos…');

  function editar(i, campo, valor) {
    setSucio(true);
    setDatos(function (d) {
      const ps = d.puestos.slice();
      const p = Object.assign({}, ps[i]);
      if (campo === 'puesto' || campo === 'notas') p[campo] = valor;
      else if (campo === 'excluido') p.excluido = valor;
      else if (campo === 'excepcional') p.excepcional = valor;
      else if (campo === 'sinReparto') p.sinReparto = valor;
      else {
        const caps = (p.capacidades || []).filter(function (c) { return c !== campo; });
        if (valor) caps.push(campo);
        p.capacidades = caps;
      }
      ps[i] = p;
      return Object.assign({}, d, { puestos: ps });
    });
  }
  function anadir() {
    setSucio(true);
    setDatos(function (d) {
      return Object.assign({}, d, { puestos: d.puestos.concat([{ puesto: '', capacidades: [], excluido: false, notas: '' }]) });
    });
  }
  function quitar(i) {
    setSucio(true);
    setDatos(function (d) { const ps = d.puestos.slice(); ps.splice(i, 1); return Object.assign({}, d, { puestos: ps }); });
  }
  function guardar() {
    props.setCargando(true);
    setMsg(null);
    run('setPuestos', datos.puestos).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo guardar.' }); return; }
      setSucio(false);
      setMsg({ ok: true, txt: '✓ Puestos guardados. Se aplican de inmediato a cambios y a reparto.' });
      return recargarCache('puestos', setDatos, 'getPuestos');
    }).catch(function (e2) {
      setMsg({ ok: false, txt: 'Error al guardar: ' + (e2 && e2.message ? e2.message : e2) });
    }).finally(function () { props.setCargando(false); });
  }

  const tiene = (p, c) => (p.capacidades || []).indexOf(c) !== -1;
  const enUso = datos.enUso || {};

  return e('div', { className: 'tarjeta', style: { maxWidth: '720px', margin: '0 auto' } },
    e('h3', { style: { marginTop: 0 } }, '🎓 Puestos y competencias'),
    e('ul', { className: 'muted', style: { fontSize: '12px', marginTop: 0 } },
      e('li', null, e('b', null, 'Supervisar'), ' / ', e('b', null, 'Instruir'),
        ': recibe Ms/Ts o Mo/To y entra en ese reparto.'),
      e('li', null, e('b', null, 'Evaluar'), ': puede firmar una evaluación (EvM/EvT).'),
      e('li', null, e('b', null, 'Última opción'), ': solo si no queda nadie con el puesto de verdad. Es el SUPEX.'),
      e('li', null, e('b', null, 'Cambia turnos'), ': sin esta marca no propone, no sale como candidato y sus cambios se rechazan. Lo propio de las jefaturas.'),
      e('li', null, e('b', null, 'Recibe servicios'), ': entra en el reparto de extras, voluntarias, COS, ' +
        'activaciones y desprogramaciones. Sin ella sigue saliendo en la tabla de acumulados —su histórico ' +
        'existe— pero nunca en la cola de «a quién le toca». Es lo propio de JTWR y JSUPIN.'),
      e('li', null, 'Un puesto que esté en el cuadrante y no aquí se queda sin todas. Si alguien no aparece donde debería, mira aquí primero.')),
    msg && e('div', { className: msg.ok ? 'verde' : 'rojo', style: { marginBottom: 8 } }, msg.txt),
    e('table', { className: 'tabla-turnero' },
      e('thead', null, e('tr', null,
        e('th', null, 'Puesto'), e('th', null, 'Supervisar'), e('th', null, 'Instruir'),
        e('th', { title: 'Puede firmar una evaluación (EvM/EvT)' }, 'Evaluar'),
        e('th', { title: 'Solo entra en el reparto si no hay nadie con el puesto' }, 'Última opción'),
        e('th', null, 'Cambia turnos'),
        e('th', { title: 'Entra en el reparto de extras, voluntarias, COS, activaciones y desprogramaciones' }, 'Recibe servicios'),
        e('th', null, 'Personas'), e('th', null, ''))),
      e('tbody', null, datos.puestos.map(function (p, i) {
        return e('tr', { key: i },
          e('td', null, e('input', {
            type: 'text', value: p.puesto, style: { width: '80px', textTransform: 'uppercase' },
            onChange: function (ev) { editar(i, 'puesto', ev.target.value); }
          })),
          e('td', null, e('input', {
            type: 'checkbox', checked: tiene(p, 'supervisar'),
            onChange: function (ev) { editar(i, 'supervisar', ev.target.checked); }
          })),
          e('td', null, e('input', {
            type: 'checkbox', checked: tiene(p, 'instruir'),
            onChange: function (ev) { editar(i, 'instruir', ev.target.checked); }
          })),
          e('td', null, e('input', {
            type: 'checkbox', checked: tiene(p, 'evaluar'),
            onChange: function (ev) { editar(i, 'evaluar', ev.target.checked); }
          })),
          e('td', null, e('input', {
            type: 'checkbox', checked: !!p.excepcional,
            onChange: function (ev) { editar(i, 'excepcional', ev.target.checked); }
          })),
          e('td', null, e('input', {
            type: 'checkbox', checked: !p.excluido,
            onChange: function (ev) { editar(i, 'excluido', !ev.target.checked); }
          })),
          e('td', null, e('input', {
            type: 'checkbox', checked: !p.sinReparto,
            onChange: function (ev) { editar(i, 'sinReparto', !ev.target.checked); }
          })),
          e('td', { className: 'muted' }, enUso[p.puesto] ? enUso[p.puesto] : '—'),
          e('td', null, e('button', {
            className: 'sec', style: { fontSize: '11px', padding: '2px 6px' },
            onClick: function () { quitar(i); }
          }, '✕')));
      }))),
    e('div', { className: 'fila', style: { marginTop: 10 } },
      e('button', { className: 'sec', onClick: anadir }, '+ Añadir puesto'),
      e('button', { className: 'accion', disabled: !sucio, onClick: guardar }, 'Guardar')),
    e('p', { className: 'muted', style: { fontSize: '11px', marginTop: 8 } },
      'La columna «Personas» cuenta cuántos controladores tienen ese puesto en los meses vigentes. ' +
      'Un puesto con personas pero sin fila aquí es casi siempre una errata en la hoja.'));
}

// ── Cargos: quién ocupa qué puesto, desde cuándo, y su acceso a la app ─────
function PanelCargos(props) {
  const [d, setD] = React.useState(null);
  const [msg, setMsg] = React.useState(null);
  const [hist, setHist] = React.useState(false);
  const [url, setUrl] = React.useState(null);
  const [bajas, setBajas] = React.useState(false);
  const [ediciones, setEdiciones] = React.useState({});   // cta -> campos tocados
  const [editando, setEditando] = React.useState(null);  // solo una fila a la vez
  const [orden, setOrden] = React.useState({ campo: 'cta', asc: true });
  const [filtro, setFiltro] = React.useState('');
  const [nuevoCta, setNuevoCta] = React.useState({ cta: '', nombre: '', email: '', grupo: '', puesto: '' });
  const [plan, setPlan] = React.useState(null);      // plantilla del correo
  const [planTxt, setPlanTxt] = React.useState('');

  function recargar() {
    return runCache('cargos', setD, 'getCargos').catch(function (e2) {
      setMsg({ ok: false, txt: String(e2 && e2.message ? e2.message : e2) });
    });
  }
  React.useEffect(function () {
    recargar();
    runCache('urlapp', setUrl, 'getUrlApp').catch(function () {});
    runCache('plantilla', function (r) { setPlan(r); setPlanTxt(r.texto); }, 'getPlantillaInvitacion').catch(function () {});
  }, []);
  if (!d) return e('p', { className: 'muted' }, 'Cargando cargos…');

  function accion(fn, args, exito) {
    props.setCargando(true); setMsg(null);
    run.apply(null, [fn].concat(args)).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo.' }); return; }
      setMsg({ ok: true, txt: typeof exito === 'function' ? exito(r) : exito });
      return recargar();
    }).catch(function (e2) { setMsg({ ok: false, txt: String(e2 && e2.message ? e2.message : e2) }); })
      .finally(function () { props.setCargando(false); });
  }
  function baja(c) {
    const hoy = new Date().toISOString().slice(0, 10);
    confirmar('Se cerrará el periodo de ' + c.cta + ' como ' + c.puesto + ' con fecha de hoy.',
      { titulo: 'Cerrar el periodo', ok: 'Cerrar', peligro: true })
      .then(function (si) { if (si) accion('bajaCargo', [c.fila, hoy], '✓ ' + c.cta + ' deja ' + c.puesto + '.'); });
  }
  function editar(cta, campo, valor) {
    setEdiciones(function (p) {
      const q = Object.assign({}, p);
      q[cta] = Object.assign({}, q[cta] || {});
      q[cta][campo] = valor;
      return q;
    });
  }
  function guardarCta(cta) {
    const ed = Object.assign({}, ediciones[cta]);
    const actual = (d.controladores || []).filter(function (c) { return c.cta === cta; })[0] || {};
    // El puesto NO es un campo de la ficha: es un cargo con fechas. Cambiarlo
    // cierra el periodo anterior la víspera y abre uno nuevo, que es lo que
    // hace `altaCargo`. Por eso va por su lado y no dentro del guardado.
    const puestoNuevo = String(ed.puesto == null ? actual.puesto : ed.puesto || '').trim().toUpperCase();
    const cambiaPuesto = ed.puesto !== undefined &&
      puestoNuevo !== String(actual.puesto || '').trim().toUpperCase();
    delete ed.puesto;

    const hoy = new Date();
    const fechaHoy = ('0' + hoy.getDate()).slice(-2) + '/' +
      ('0' + (hoy.getMonth() + 1)).slice(-2) + '/' + hoy.getFullYear();

    props.setCargando(true);
    setMsg(null);
    run('actualizarControlador', cta, ed)
      .then(function (r) {
        if (!r || r.ok === false) throw new Error((r && r.error) || 'No se pudo guardar.');

  const [cal, setCal] = React.useState(null);

  const [cta, setCta] = React.useState('');

  const [hist, setHist] = React.useState(null); // historial de la celda (cta, día)
  const [cub, setCub] = React.useState(null);        // candidatos para cubrir
  const [cubTurno, setCubTurno] = React.useState('M');
  const [cubTipo, setCubTipo] = React.useState('E');
  const [camb, setCamb] = React.useState(null);      // candidatos para CAMBIAR con él

  React.useEffect(function () {
    setMsg(null);
    runCache('global_' + props.mes, function (r) {
      setCal(r);
      if (r && r.controladores && r.controladores.length > 0) {
        // ORDENAR CONTROLADORES ALFABÉTICAMENTE POR CTA (INICIALES)
        const listaOrdenada = r.controladores.slice().sort(function (a, b) {
          return String(a.cta || '').localeCompare(String(b.cta || ''));
        });
        setControladores(listaOrdenada);
        if (!cta) setCta(listaOrdenada[0].cta);
      }
      if (r && r.dias && r.dias.length > 0 && !dia) {
        setDia(r.dias[0]);
      }
    }, 'getCalendarioGlobal', props.mes).catch(function (err) {
      setMsg({ ok: false, txt: 'Error al cargar datos: ' + (err && err.message ? err.message : err) });
    });
  }, [props.mes]);

  // Historial de la celda seleccionada: lo que se le ha hecho a ese día de ese
  // controlador, con el valor previo de cada paso. Es la base del deshacer.
  function cargarHist() {
    if (!cta || !dia) { setHist(null); return; }
    run('getLogDia', props.mes, cta, dia)
      .then(function (r) { setHist((r && r.entradas) || []); })
      .catch(function () { setHist([]); });
  }
  // Al cambiar de persona, de día o de mes, las listas de candidatos que
  // hubiera en pantalla son de OTRA celda: se tiran. Dejarlas visibles invita a
  // pulsar «Aplicar» sobre un día que ya no es el que se está mirando.
  React.useEffect(function () {
    setCamb(null);
    setCub(null);
    cargarHist();

  function buscarCobertura() {
    props.setCargando(true); setMsg(null); setCub(null);
    run('candidatosParaCubrir', props.mes, dia, cubTurno, cubTipo)
      .then(function (r) {
        if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo buscar.' }); return; }
        setCub(r);
      })
      .catch(function (e2) { setMsg({ ok: false, txt: String(e2 && e2.message ? e2.message : e2) }); })
      .finally(function () { props.setCargando(false); });
  }
  function asignarCobertura(c) {
    const etiqueta = { E: 'horas extra', V: 'horas voluntarias', C: 'COS', A: 'activación de imaginaria' }[cubTipo] || cubTipo;
    confirmar((cubTipo === 'A'
        ? 'Se activa la imaginaria de ' + c.cta + ' (' + c.nombre + ') del día ' + dia +
          ': su ' + c.desde + ' pasa a ser ' + cubTurno + '.'
        : 'Se le asigna a ' + c.cta + ' (' + c.nombre + ') el turno ' + cubTurno +
          ' del día ' + dia + ' como ' + etiqueta + '.') +
      (c.ok ? '' : '\n\n⚠ OJO: con este turno incumpliría — ' + c.violaciones.map(function (v) { return v.detalle; }).join('; ')),
      { titulo: 'Asignar cobertura', ok: 'Asignar', peligro: !c.ok })
      .then(function (si) {
        if (!si) return;
        props.setCargando(true); setMsg(null);
        run('registrarAccionAdmin', {
          mes: props.mes, cta: c.cta, dia: dia, tipo: cubTipo,
          nuevoTurno: cubTurno, motivo: 'Cobertura ' + etiqueta + ' asignada por admin'
        }).then(function (r) {
          if (r && r.ok === false) { setMsg({ ok: false, txt: r.error || 'No se pudo asignar.' }); return; }
          setMsg({ ok: true, txt: '✓ ' + c.cta + ' cubre el día ' + dia + ' (' + cubTurno + ') como ' + etiqueta + '.' });
          setCub(null);
          return recargarCache('global_' + props.mes, setCal, 'getCalendarioGlobal', props.mes);
        }).catch(function (e2) { setMsg({ ok: false, txt: String(e2 && e2.message ? e2.message : e2) }); })
          .finally(function () { cargarHist(); props.setCargando(false); });
      });

  // El circuito normal son tres pasos y tres personas. Cuando el acuerdo ya
  // existe fuera de la app, esto lo aplica de una vez: mismo chequeo de
  // legalidad, misma traza en LOG_CELDAS, pero sin la ronda de confirmaciones.
  function buscarCambio() {
    props.setCargando(true); setMsg(null); setCamb(null);
    run('candidatosCambioAdmin', props.mes, dia, cta)
      .then(function (r) {
        if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo buscar.' }); return; }
        setCamb(r);
      })
      .catch(function (e2) { setMsg({ ok: false, txt: String(e2 && e2.message ? e2.message : e2) }); })
      .finally(function () { props.setCargando(false); });
  }

  // Un solo sitio para lanzarlo, se fuerce o no: así el camino de «anular las
  // solicitudes y seguir» no puede quedar desincronizado del normal.
  function enviarCambio(c, forzar) {
    props.setCargando(true); setMsg(null);
    return run('cambioDirectoAdmin', props.mes, c.movimientos, {
      motivo: motivo || 'Cambio directo aplicado por jefatura',
      solicitante: cta,
      forzar: !!forzar
    }).then(function (r) {
      if (!r) { setMsg({ ok: false, txt: 'El servidor no respondió.' }); return; }

      // Solicitudes en curso sobre esos días: se ofrece anularlas y seguir.
      if (r.ok === false && r.conflictos && r.conflictos.length && !forzar) {
        return confirmar(r.error + '\n\n¿Anulo esas solicitudes y aplico el cambio?',
          { titulo: 'Hay solicitudes en curso', ok: 'Anular y aplicar', peligro: true })
          .then(function (si) { if (si) return enviarCambio(c, true); });
      }
      if (r.ok === false) {
        setMsg({ ok: false, txt: (r.error || 'No se pudo aplicar.') +
          (r.violaciones && r.violaciones.length
            ? ' — ' + r.violaciones.map(function (v) { return reglaTxt(v.regla) + ' (' + v.detalle + ')'; }).join('; ')
            : '') });
        // Si el cuadrante se ha movido, lo cacheado ya no vale.
        if (r.refrescar) return recargarCache('global_' + props.mes, setCal, 'getCalendarioGlobal', props.mes);
        return;
      }

      setMsg({
        ok: r.escrito !== false,
        txt: (r.escrito === false ? '⚠ ' : '✓ ') + 'Cambio aplicado: ' + r.resumen +
          (r.forzado ? ' · ⚠ FORZADO pese a incumplimientos (queda anotado)' : '') +
          (r.anuladas && r.anuladas.length ? ' · anuladas #' + r.anuladas.join(', #') : '') +
          (r.escrito === false ? ' · ' + r.error : '')
      });
      setCamb(null);
      setMotivo('');
      // Cambia el turnero entero, no una celda: fuera todo lo cacheado del mes.
      olvidarPrefijo('global_' + props.mes);
      return recargarCache('global_' + props.mes, setCal, 'getCalendarioGlobal', props.mes);
    }).catch(function (e2) {
      setMsg({ ok: false, txt: String(e2 && e2.message ? e2.message : e2) });
    }).finally(function () { cargarHist(); props.setCargando(false); });
  }

  function aplicarCambio(c) {
    const detalle = c.movimientos.map(function (mv) {
      return '· ' + mv.cta + ', día ' + mv.dia + ': ' + (mv.de || 'libre') + ' → ' + (mv.a || 'libre');
    }).join('\n');
    const cabecera = {
      INTERCAMBIO: 'Intercambio de turnos',
      CESION: 'Cesión de turno',
      RECEPCION: 'Recepción de turno'
    }[c.tipo] || 'Cambio de turnos';

    confirmar(
      cabecera + ' entre ' + cta + ' y ' + c.cta + ' (' + c.nombre + '):\n\n' + detalle +
      '\n\nSe aplica AHORA, sin pedirles confirmación y sin pasar por validación. ' +
      'Queda registrado a nombre de ' + cta + ', con tu firma, y se puede deshacer día a día.' +
      (c.bloqueado ? '\n\n🔒 ' + c.cta + ' había bloqueado ese día.' : '') +
      (c.ok ? '' : '\n\n⚠ OJO: incumpliría — ' + c.detalles.join('; ') +
                   '\n\nSi sigues, el cambio se aplica igualmente y el incumplimiento queda escrito en la fila.'),
      { titulo: 'Aplicar cambio directo', ok: c.ok ? 'Aplicar' : 'Forzar y aplicar', peligro: !c.ok })
      .then(function (si) { if (si) return enviarCambio(c, !c.ok); });
  }

  // Deshacer = devolver la celda al valor previo de la última entrada viva.
  function deshacer() {
    props.setCargando(true);
    setMsg(null);
    run('deshacerDia', props.mes, cta, dia).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo deshacer.' }); return; }
      setMsg({ ok: true, txt: '↶ Día ' + r.dia + ' (' + r.cta + ') devuelto a ' + (r.turno || 'libre') + ' (estaba ' + (r.anterior || 'libre') + ')' });
      return recargarCache('global_' + props.mes, setCal, 'getCalendarioGlobal', props.mes);
    }).catch(function (err) {
      setMsg({ ok: false, txt: 'Error al deshacer: ' + (err && err.message ? err.message : err) });
    }).finally(function () {
      cargarHist();
      props.setCargando(false);
    });
  }

      // Si es restablecer, no enviamos cadena vacía, sino la señal explícita 'RESTABLECER'

    run('registrarAccionAdmin', payload).then(function (res) {
