<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
  const e = React.createElement;
  window.VERSION_JS = 'js-105-cambio-directo';

  // ── Caché de sesión del navegador ──────────────────────────────────────────
  // Al cambiar de pestaña se pinta AL INSTANTE lo último conocido y se refresca
  // en segundo plano (stale-while-revalidate). Se vacía tras cada mutación.
  const CACHE_CLI = {
    data: {},
    get: function (k, ttl) { const e2 = this.data[k]; return (e2 && (Date.now() - e2.t) < ttl) ? e2.v : null; },
    set: function (k, v) { this.data[k] = { t: Date.now(), v: v }; },
    clear: function () { this.data = {}; }
  };
  const CAMBIABLES = ['M', 'T', 'Ms', 'Ts', 'Mo', 'To', 'im', 'it'];
  // Lo justo para reconocer un código en el cliente: el motor vive en el
  // servidor y aquí solo hace falta saber si un día son vacaciones.
  function normalizarCodigoCli(c) { return String(c == null ? '' : c).trim().toUpperCase(); }
  // Borrador de la solicitud en curso, POR MES. Vive fuera de React para que
  // sobreviva al cambiar de pestaña (el componente Calendario se desmonta).
  const BUILDER = {};
  const MES3 = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
  const REGLA_TXT = {
    R1: 'descanso <12h entre turnos', R1b: 'jornada >10h', R2: 'más de 6 días seguidos',
    R3: 'el ciclo supera 50h', R4: 'descanso entre ciclos <48h', R5: 'supera 170h/mes (convenio)',
    ROL: 'no habilitado para ese turno', COB: 'quedaría un turno sin cubrir',
    ESTADO: 'la hoja ha cambiado', NO_CAMBIABLE: 'turno no intercambiable', VACACIONES: 'día de vacaciones'
  };
  function reglaTxt(r) { return REGLA_TXT[r] || r; }
  // Marcas de estado de la solicitud, por día, en el calendario.
  const EST_MARCA = {
    REGISTRADO: { icon: '⏳', color: '#e0a800', txt: 'Solicitado · pendiente de que responda el compañero' },
    CONFIRMADO: { icon: '🤝', color: '#2f6fb0', txt: 'Aceptado por el compañero · pendiente de validación de jefatura' },
    VALIDADO: { icon: '✅', color: '#2f8f46', txt: 'Validado por jefatura · pendiente de transcribir al turnero' },
    RECHAZADO: { icon: '❌', color: '#c0392b', txt: 'Rechazado por el compañero · puedes volver a proponerlo' }
  };
  // Marcas de disponibilidad propia (bloquear/ofrecer). No reservan el día ni te
  // impiden nada: solo filtran y ordenan lo que ven tus compañeros.
  const DISP_MARCA = {
    BLOQUEADO: { icon: '🔒', color: '#7a7f87', txt: 'Día bloqueado · no aparecerás como candidato para tus compañeros' },
    OFRECIDO: { icon: '🙋', color: '#2f8f46', txt: 'Día ofrecido · aparecerás destacado y el primero para tus compañeros' }
  };

  // ── Confirmación propia ───────────────────────────────────────────────────
  // window.confirm enseña el dominio interno de googleusercontent y no se puede
  // dar estilo. Este vive fuera de React (como BUILDER) para que confirmar() se
  // pueda llamar desde cualquier sitio sin ir pasando props.
  const MODAL = { abrir: null };
  function confirmar(texto, opts) {
    return new Promise(function (resolve) {
      if (MODAL.abrir) MODAL.abrir({ texto: texto, opts: opts || {}, resolve: resolve });
      else resolve(window.confirm(texto));   // por si aún no está montado
    });
  }

  // Diálogo. Enter acepta, Escape cancela.
  function Modal() {
    const [pet, setPet] = React.useState(null);
    React.useEffect(function () {
      MODAL.abrir = setPet;
      return function () { MODAL.abrir = null; };
    }, []);
    React.useEffect(function () {
      if (!pet) return;
      function tecla(ev) {
        if (ev.key === 'Escape') responder(false);
        else if (ev.key === 'Enter') responder(true);
      }
      window.addEventListener('keydown', tecla);
      return function () { window.removeEventListener('keydown', tecla); };
    }, [pet]);
    function responder(v) { if (pet) { pet.resolve(v); setPet(null); } }
    if (!pet) return null;
    const o = pet.opts || {};
    return e('div', {
      className: 'modal-fondo',
      onClick: function (ev) { if (ev.target === ev.currentTarget) responder(false); }
    },
      e('div', { className: 'modal' },
        o.titulo && e('h3', { className: 'modal-tit' }, o.titulo),
        e('div', { className: 'modal-cuerpo' },
          String(pet.texto).split('\n').map(function (l, i) {
            return l ? e('p', { key: i }, l) : e('div', { key: i, style: { height: 6 } });
          })),
        e('div', { className: 'modal-pie' },
          e('button', { className: 'sec', onClick: function () { responder(false); } }, o.cancelar || 'Cancelar'),
          e('button', {
            className: 'accion' + (o.peligro ? ' no' : ''), autoFocus: true,
            onClick: function () { responder(true); }
          }, o.ok || 'Aceptar'))));
  }

  // Puente con el backend (google.script.run como promesa).
  // ── Consola de depuración del navegador: registra CADA llamada al servidor ─
  window.__consola = [];
  function _con(txt, tipo) {
    window.__consola.push({ t: new Date().toISOString().slice(11, 23), txt: txt, tipo: tipo || '' });
    if (window.__consola.length > 300) window.__consola.shift();
  }

  function run(name) {
    const args = Array.prototype.slice.call(arguments, 1);
    const t0 = Date.now();
    const argTxt = args.length ? ' ' + JSON.stringify(args).slice(0, 80) : '';
    _con('→ ' + name + argTxt, 'inicio');
    // google.script.run expone las funciones del servidor según la lista que
    // el iframe de Apps Script tenía al cargar la página. Si se despliega una
    // función nueva y la pestaña sigue abierta, esa lista se queda vieja y el
    // acceso da undefined: "reading 'apply'", que no dice nada. Lo decimos.
    if (typeof google === 'undefined' || !google.script || !google.script.run ||
        typeof google.script.run[name] !== 'function') {
      _con('✗ ' + name + ' no existe en el servidor (o la página está desfasada)', 'error');
      return Promise.reject(new Error(
        'La página no conoce la función "' + name + '". Suele ser que se ha desplegado ' +
        'código nuevo con esta pestaña abierta: recarga forzando caché (Ctrl+Shift+R) y reintenta.'));
    }
    return new Promise(function (resolve, reject) {
      let done = false;
      const to = setTimeout(function () {
        if (!done) {
          done = true;
          _con('✗ ' + name + ' TIMEOUT tras 45 s (el servidor no respondió)', 'error');
          reject(new Error('La operación tardó demasiado (timeout de 45 s). Reintenta con ↻ Actualizar.'));
        }
      }, 45000);
      google.script.run
        .withSuccessHandler(function (r) {
          if (!done) {
            done = true; clearTimeout(to);
            // Apps Script devuelve null si el retorno contiene tipos ilegales (p.ej. Date).
            if (r === null || r === undefined) _con('⚠ ' + name + ' devolvió NULL: el servidor intentó retornar un tipo ilegal (¿Date?)', 'error');
            else _con('✓ ' + name + ' (' + (Date.now() - t0) + ' ms)', 'ok');
            resolve(r);
          }
        })
        .withFailureHandler(function (err) {
          if (!done) { done = true; clearTimeout(to); _con('✗ ' + name + ' (' + (Date.now() - t0) + ' ms): ' + (err && err.message ? err.message : err), 'error'); reject(err); }
        })
        [name].apply(null, [window.TOKEN].concat(args));
    });
  }
  // Stale-while-revalidate en una llamada. Pinta AL INSTANTE lo último conocido
  // y refresca en segundo plano; si no hay nada guardado, espera la respuesta.
  // `aplicar` se llama una vez con lo cacheado (si lo hay) y otra con lo fresco.
  //
  // Sin esto, cada cambio de pestaña volvía a pedirlo todo al servidor, y con
  // las sub-pestañas eso se notó de golpe: el componente se desmonta al salir,
  // así que el efecto se vuelve a disparar al volver.
  const TTL_CLI = 120000;   // 2 min
  function runCache(clave, aplicar, fn) {
    const args = Array.prototype.slice.call(arguments, 3);
    const hit = CACHE_CLI.get(clave, TTL_CLI);
    if (hit) aplicar(hit);
    return run.apply(null, [fn].concat(args)).then(function (r) {
      CACHE_CLI.set(clave, r);
      aplicar(r);
      return r;
    });
  }
  // Tras guardar algo, lo cacheado de esa clave deja de valer.
  function olvidar(clave) { delete CACHE_CLI.data[clave]; }
  // Al aprobar algo cambia el turnero entero: no vale con una clave suelta.
  function olvidarPrefijo(pref) {
    Object.keys(CACHE_CLI.data).forEach(function (k) {
      if (k.indexOf(pref) === 0) delete CACHE_CLI.data[k];
    });
  }
  // Recarga tras guardar: tira lo cacheado antes de pedir, para no pintar por
  // un instante el valor que se acaba de cambiar.
  function recargarCache(clave, aplicar, fn) {
    olvidar(clave);
    return runCache.apply(null, [clave, aplicar, fn].concat(Array.prototype.slice.call(arguments, 3)));
  }

  // ping no lleva token (no depende de hojas): mide si el servidor responde.
  function runPing() {
    const t0 = Date.now();
    _con('→ ping', 'inicio');
    return new Promise(function (resolve) {
      const to = setTimeout(function () { _con('✗ ping TIMEOUT (el servidor no responde en absoluto)', 'error'); resolve(null); }, 20000);
      google.script.run
        .withSuccessHandler(function (r) { clearTimeout(to); _con('✓ ping (' + (Date.now() - t0) + ' ms) · servidor ' + (r && r.version), 'ok'); resolve(r); })
        .withFailureHandler(function (e2) { clearTimeout(to); _con('✗ ping: ' + e2, 'error'); resolve(null); })
        .ping();
    });
  }
  // Preferencias de usuario (filtros de histórico). Se cargan una vez y se
  // guardan en properties del script (persisten entre sesiones y dispositivos).
  var PREFS = null;
  function cargarPrefs(cb) {
    if (PREFS) { cb(PREFS); return; }
    run('getPrefs').then(function (p) { PREFS = p || {}; cb(PREFS); }).catch(function () { PREFS = {}; cb(PREFS); });
  }
  function guardarPrefs(patch) {
    PREFS = Object.assign(PREFS || {}, patch);
    run('setPrefs', PREFS).catch(function () {});
  }
  function clase(code) { return String(code || '').replace(/[^A-Za-z]/g, ''); }
  function mesInfo(mes) {
    const p = String(mes).split('-');
    const idx = MES3.indexOf((p[0] || '').toUpperCase().slice(0, 3));
    return { monthIdx: idx < 0 ? 0 : idx, year: 2000 + parseInt(p[1], 10) };
  }

  // ═════════════════════════════════════════════════════════════════════════
  function App() {
    const usuario = window.USUARIO;
    const [meses, setMeses] = React.useState([]);
    const [mes, setMes] = React.useState(null);
    const [tab, setTab] = React.useState('cal');
    const [cargando, setCargando] = React.useState(false);
    const [ver, setVer] = React.useState(null);
    // El permiso de reparto va por CARGO (JSUPIN), que no está en window.USUARIO:
    // llega con getEstadoInicial, así que la pestaña aparece al resolverse.
    const [puedeRepartir, setPuedeRepartir] = React.useState(false);
    // Qué puede ver este perfil. Lo decide el servidor; aquí no se deduce.
    const [vistas, setVistas] = React.useState(null);

    React.useEffect(function () {
      if (!usuario) return;
      run('getEstadoInicial').then(function (est) {
        setMeses(est.meses);
        setMes(est.mesActual || (est.meses[0] || null));
        setVer(est.versiones || null);
        setPuedeRepartir(!!est.puedeRepartir);
        setVistas(est.vistas || null);
        if (est.calendario) window.__calInicial = est.calendario; // el calendario viaja en la misma llamada
      });
    }, []);

    if (!usuario) {
      return e('div', { style: { padding: 24 } },
        e('h2', null, 'Acceso no válido'),
        e('p', null, 'Este enlace no es válido. Usa el enlace personal que se te ha facilitado (incluye tu token).'));
    }

    // Dos niveles: arriba, dónde estás; dentro, qué haces. Qué aparece sale de
    // `vistas`, que manda el servidor: aquí no se deduce del rol. Una pestaña
    // contenedora se muestra si le queda alguna hija dentro, así que el menú
    // no puede quedar incoherente. Hasta que llegue la lista se pinta todo,
    // que es lo que había antes de que existieran los permisos.
    const puede = function (id) { return !vistas || vistas.indexOf(id) !== -1; };
    const hayEn = function (pref) {
      return !vistas || vistas.some(function (v) { return v.indexOf(pref + '.') === 0; });
    };
    const tabs = [];
    if (puede('guia'))    tabs.push({ id: 'guia',    txt: 'Guía' });
    // «global» es a la vez la vista del turnero y el grupo que la contiene, así
    // que hay que mirar las dos formas: la pestaña sale si le queda cualquiera.
    if (puede('global') || hayEn('global')) tabs.push({ id: 'global', txt: 'Turnero Global' });
    if (hayEn('cal'))     tabs.push({ id: 'cal',     txt: 'Mi calendario' });
    if (hayEn('gestion')) tabs.push({ id: 'gestion', txt: 'Gestión' });
    if (puede('diag'))    tabs.push({ id: 'diag',    txt: 'Diagnóstico' });
    if (hayEn('config'))  tabs.push({ id: 'config',  txt: 'Configuración' });
    // Si la pestaña abierta deja de estar permitida, cae en la primera.
    const tabActiva = tabs.some(function (t) { return t.id === tab; })
      ? tab : (tabs.length ? tabs[0].id : '');
    return e('div', null,
      e(Modal),
      cargando && e('div', { className: 'overlay' }, '⏳ Guardando…'),
      e('header', null,
        e('div', null,
          e('h1', null, 'Cambios de turno'),
          e('div', { className: 'usuario' }, usuario.nombre + ' (' + usuario.cta + ')',
            e('span', { className: 'rolchip' }, usuario.rol))),
        // ⚠ EL ÚNICO SELECTOR DE MES DE LA APP. Reparto, Instrucción, Evaluación
        // y Dotación tenían el suyo, así que la cabecera decía AGO-26 y el panel
        // SEP-26 a la vez y no había forma de saber cuál mandaba. Un panel toma
        // el mes de `props.mes` y recarga con un efecto sobre él; nadie más lo
        // elige.
        e('div', null,
          e('label', { className: 'muted' }, 'Mes: '),
          e('select', { value: mes || '', onChange: function (ev) { setMes(ev.target.value); } },
            meses.map(function (m) { return e('option', { key: m, value: m }, m); })))),
      e('div', { className: 'tabs' },
        tabs.map(function (t) {
          return e('button', { key: t.id, className: 'tab' + (tabActiva === t.id ? ' activa' : ''), onClick: function () { setTab(t.id); } }, t.txt);
        })),
      mes && e(Vista, { tab: tabActiva, mes: mes, usuario: usuario, setCargando: setCargando, puedeRepartir: puedeRepartir, vistas: vistas }),
      !mes && meses.length === 0 && e('p', { className: 'muted' }, 'No hay meses vigentes disponibles.'),
      ver && e('div', { className: 'muted', style: { marginTop: 18, fontSize: '10px', wordBreak: 'break-all' } },
        'Versiones: ' + Object.keys(ver).map(function (k) { return k + '=' + ver[k]; }).join(' · '))
    );
  }
// Función helper para resolver la clase CSS según el tipo de turno
// marca: lo que dice el FONDO de la celda en el cuadrante, que es donde vive
// el significado (una M sobre verde es una extra). Manda sobre el código.
const MARCA_CLASE = {
  baja: 'turno-baja', extra: 'turno-extra', voluntaria: 'turno-voluntaria',
  activada: 'turno-activada', fueraCiclo: 'turno-fuera', gris: 'turno-vacaciones'
};
function getClaseTurno(turno, esFinde, marca) {
  if (marca && MARCA_CLASE[marca]) return MARCA_CLASE[marca];
  if (!turno) return esFinde ? 'bg-finde' : 'bg-normal';

  // 1. Bajas / Permisos médicos (-M, -T, Bm, Bt...)
  if (turno.indexOf('-') === 0 || ['Bm', 'Bt', 'Bim', 'Bit'].indexOf(turno) !== -1) {
    return 'turno-baja';
  }
  // 2. Vacaciones y licencias (V, P, Pm, mr, tr...)
  if (turno === 'V' || ['P', 'Pm', 'Pt', 'Pim', 'Pit', 'mr', 'tr', 'imr', 'itr'].indexOf(turno) !== -1) {
    return 'turno-vacaciones';
  }
  // 3. Activación de imaginaria (A)
  if (['A', 'M_act', 'T_act'].indexOf(turno) !== -1) {
    return 'turno-activada';
  }
  // 4. Horas voluntarias (HHVV / Tipo V)
  if (turno.indexOf('_V') !== -1 || turno === 'HHVV') {
    return 'turno-voluntaria';
  }
  // 5. Horas extra / COS (Tipo E / C)
  if (turno.indexOf('_E') !== -1 || turno === 'COS' || turno === 'EXTRA') {
    return 'turno-extra';
  }

  return esFinde ? 'bg-finde' : 'bg-normal';
}

function CalendarioGlobal(props) {
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [celda, setCelda] = React.useState(null);   // celda pulsada
  const [detalle, setDetalle] = React.useState(null); // notas e historial del MES
  const [editNota, setEditNota] = React.useState(null); // texto en edición, o null

  // Notas e historial del mes entero, una sola vez. Un viaje por clic era un
  // desperdicio: getNotes() del servidor trae la rejilla completa igual de
  // rápido. Se guarda en la caché de sesión, así que volver a la pestaña
  // tampoco lo repite.
  function cargarDetalle(mes) {
    const hit = CACHE_CLI.get('detalle_' + mes, 120000);
    if (hit) { setDetalle(hit); return Promise.resolve(hit); }
    return run('getDetalleMes', mes)
      .then(function (r) { CACHE_CLI.set('detalle_' + mes, r); setDetalle(r); return r; })
      .catch(function () { const vacio = { notas: {}, historial: {} }; setDetalle(vacio); return vacio; });
  }

  function guardarNota() {
    const c = celda;
    const hacer = function () {
      props.setCargando(true);
      run('setNotaCelda', props.mes, c.cta, c.dia, editNota).then(function (r) {
        if (!r || r.ok === false) { setCelda(Object.assign({}, c, { error: (r && r.error) || 'No se pudo guardar.' })); return; }
        CACHE_CLI.data && delete CACHE_CLI.data['detalle_' + props.mes];
        setEditNota(null);
        setDetalle(null);
        return cargarDetalle(props.mes).then(function (d) {
          setCelda(Object.assign({}, c, {
            nota: ((d.notas || {})[c.cta] || {})[c.dia] || '',
            entradas: (d.historial || {})[c.cta + '|' + c.dia] || []
          }));
        });
      }).catch(function (e2) {
        setCelda(Object.assign({}, c, { error: String(e2 && e2.message ? e2.message : e2) }));
      }).finally(function () { props.setCargando(false); });
    };
    // Si se van líneas SYS:, avisar. Son la traza que deja la app al escribir.
    const sysAntes = (c.nota || '').split('\n').filter(function (l) { return l.indexOf('SYS:') === 0; }).length;
    const sysAhora = (editNota || '').split('\n').filter(function (l) { return l.indexOf('SYS:') === 0; }).length;
    if (sysAhora < sysAntes) {
      confirmar('Vas a borrar ' + (sysAntes - sysAhora) + ' línea(s) «SYS:», que son la traza que deja la app ' +
        'al escribir en el turnero.\n\nEl historial de LOG_CELDAS no se toca, pero quien mire la hoja ya no verá ' +
        'de dónde salió ese turno.',
        { titulo: '¿Borrar la traza?', ok: 'Borrar igualmente', peligro: true })
        .then(function (si) { if (si) hacer(); });
      return;
    }
    hacer();
  }

  // Al pulsar: si ya está el mes en memoria, es instantáneo.
  function verCelda(cta, dia) {
    setEditNota(null);
    const pinta = function (d) {
      setCelda({
        cta: cta, dia: dia,
        turno: (data.rejilla[cta] || {})[dia] || '',
        nota: ((d.notas || {})[cta] || {})[dia] || '',
        entradas: (d.historial || {})[cta + '|' + dia] || []
      });
    };
    if (detalle) { pinta(detalle); return; }
    setCelda({ cta: cta, dia: dia, cargando: true });
    cargarDetalle(props.mes).then(pinta);
  }

  React.useEffect(function () {
    setError(null);
    props.setCargando(true);

    setCelda(null);
    setDetalle(null);
    // Lo cacheado de ESTE mes se pinta al instante; si no hay, a null para que
    // vuelva a decir «cargando» en vez de dejar a la vista el mes anterior.
    setData(CACHE_CLI.get('global_' + props.mes, TTL_CLI));
    runCache('global_' + props.mes, setData, 'getCalendarioGlobal', props.mes)
      .then(function () {
        props.setCargando(false);
        cargarDetalle(props.mes);   // en segundo plano: el primer clic ya es instantáneo
      })
      .catch(function(err) {
        setError(err.message || String(err));
        props.setCargando(false);
      });
  }, [props.mes]);

  if (error) return e('div', { style: { color: 'var(--rojo)', padding: '20px' } }, 'Error: ' + error);
  if (!data) return e('div', { style: { padding: '20px' } }, 'Cargando cuadrante global...');

  const info = mesInfo(props.mes);
  const LETRAS_DIA = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];

  const diasMeta = data.dias.map(function(dia) {
    const dNum = Number(dia);
    const fecha = new Date(info.year, info.monthIdx, dNum);
    const dowIndex = fecha.getDay();
    return {
      dia: dia,
      letra: LETRAS_DIA[dowIndex],
      esFinde: (dowIndex === 0 || dowIndex === 6)
    };
  });

  const DURACION_MIN = {
    M: 505, Ms: 505, Mo: 505, EvM: 505, Fm: 505,
    T: 535, Ts: 535, To: 535, EvT: 535, Ft: 535,
    im: 565, it: 565, D: 480, SIM: 480, C: 480, tr: 480
  };

  // Cabeceras
  const thLetras = [
    e('th', { key: 'h-cta', rowSpan: 2, className: 'col-cta' }, 'CTA')
  ].concat(
    diasMeta.map(function(dm) {
      return e('th', { key: 'hl-' + dm.dia, className: dm.esFinde ? 'th-finde' : '' }, dm.letra);
    })
  ).concat([
    e('th', { key: 'h-hrs', rowSpan: 2, className: 'col-horas' }, 'HORAS'),
    e('th', { key: 'h-hmax', rowSpan: 2, className: 'col-horas' }, 'H.MAX.')
  ]);

    function miCode(d) { return (cal.rejilla[d] || {})[yo] || ''; }

function PanelReparto(props) {
  const [ini, setIni] = React.useState(null);
  const mes = props.mes;   // el de la cabecera, ver `Vista`
  // ⚠ Solo supervisión. La instrucción se planifica en su pestaña: allí el lado
  // fijo es el alumno y lo que se elige es su instructor, que es lo que un
  // reparto ciego de Mo/To no puede saber. El motor sigue siendo genérico.
  const tipo = 'supervision';
  const [data, setData] = React.useState(null);
  const [msg, setMsg] = React.useState(null);
  const [sucio, setSucio] = React.useState(false);
  // Lo que cada uno ya tenía marcado en la hoja ANTES de este reparto. El
  // resumen del servidor viene con las asignaciones de la tirada ya sumadas,
  // así que se le restan una vez y a partir de ahí se cuenta en vivo: si
  // quitas una asignación a mano, su contador baja al momento.
  const [base, setBase] = React.useState({});

  React.useEffect(function () {
    runCache('reparto_ini', setIni, 'getRepartoInicial').catch(function (e2) { setMsg({ ok: false, txt: String(e2 && e2.message ? e2.message : e2) }); });
  }, []);
  // Al cambiar de mes en la cabecera, lo calculado deja de valer: era de otro.
  React.useEffect(function () { setData(null); setMsg(null); setSucio(false); }, [props.mes]);

  // ¿Hay algo guardado para lo que está seleccionado?
  function borradorDe(m, t) {
    return ((ini && ini.borradores) || []).filter(function (b) {
      return b.mes === m && b.tipo === t;
    })[0] || null;
  }

  // NADA se calcula al entrar. Recuperar un borrador implica recalcular, que
  // es lo caro —tiempo de script y de espera—, así que se avisa de que existe
  // y se espera a que lo pidas.

  function cuenta(props2, cta) {
    return Object.keys(props2 || {}).filter(function (k) { return props2[k].asignadoActual === cta; }).length;
  }
  function calcularBase(r) {
    const b = {};
    Object.keys(r.resumen || {}).forEach(function (cta) {
      const enTirada = cuenta(r.propuestas, cta);
      b[cta] = {
        tipo: (r.resumen[cta].supMes || 0) - enTirada,
        marcados: (r.resumen[cta].marcadosMes || 0) - enTirada
      };
    });
    return b;
  }
  function cargar(ignorarBorrador) {
    props.setCargando(true); setMsg(null); setData(null);
    run('calcularReparto', mes, tipo, !!ignorarBorrador)
      .then(function (r) {
        setData(r); setBase(calcularBase(r)); setSucio(false);
        if (ignorarBorrador) setMsg({ ok: true, txt: 'Propuesta calculada de cero. El borrador guardado sigue ahí hasta que guardes encima.' });

      .finally(function () { props.setCargando(false); });

  function recalcular() {

      .catch(function (e2) { setMsg({ ok: false, txt: 'No se pudo recalcular: ' + (e2 && e2.message ? e2.message : e2) }); })
      .finally(function () { props.setCargando(false); });
  }
  function editar(clave, patch) {
    setSucio(true);
    setData(function (d) {

    }).catch(function (e2) { setMsg({ ok: false, txt: 'Error: ' + (e2 && e2.message ? e2.message : e2) }); })
      .finally(function () { props.setCargando(false); });

        !data && borradorDe(mes, tipo) && e('button', { className: 'accion', onClick: function () { cargar(false); } }, '📄 Recuperar borrador'),

        data && e('button', {
          className: 'sec',

        e('p', { className: 'muted', style: { fontSize: '11px' } },
          'Otros meses con borrador a medias: ' +
          (ini.borradores || []).filter(function (b) { return !(b.mes === mes && b.tipo === tipo); })
            .map(function (b) { return b.mes; }).join(' · ')),
      msg && e('div', { className: msg.ok ? 'verde' : 'rojo', style: { marginTop: 8 } }, msg.txt)),

    data && e('div', { className: 'tarjeta' },
      e('div', { className: 'fila', style: { justifyContent: 'space-between' } },
        e('b', null, data.meta.etiqueta + ' · ' + mes + ' · ' + claves.length + ' huecos'),
        e('span', { className: sinCubrir ? 'rojo' : 'verde', style: { fontSize: '12px' } },
          sinCubrir ? ('⚠ ' + sinCubrir + ' sin cubrir') : '✓ todos cubiertos')),
      (function () {
        const nEx = claves.filter(function (k) { return data.propuestas[k].excepcional; }).length;
        return nEx > 0 && e('p', { style: { fontSize: '12px', background: '#fff8e6', padding: '6px', borderRadius: '4px' } },
          '⚠ ' + nEx + ' hueco' + (nEx > 1 ? 's' : '') + ' cubierto' + (nEx > 1 ? 's' : '') +
          ' por supervisor excepcional: no había nadie con el puesto disponible y dentro de su cupo.');
      })(),
      e('div', { className: 'muted', style: { fontSize: '11px' } },
        e('p', { style: { margin: '2px 0' } },
          'Cada fila es un turno que hay que cubrir. En el desplegable, ',
          e('b', null, 'OF (3/5)'), ' quiere decir: OF ya lleva ',
          e('b', null, '3'), ' de este tipo este mes, y su tope son ', e('b', null, '5'), '.'),
        e('p', { style: { margin: '2px 0' } },
          'Puedes cambiar a mano quien quieras. Los demás huecos se quedan como están: ',
          e('b', null, 'Recalcular'), ' vuelve a repartir todo lo que no hayas fijado.'),
        e('p', { style: { margin: '2px 0' } },
          e('b', null, '🔒'), ' marca un hueco como intocable, para que ese Recalcular no te lo cambie.')),
      e('table', { className: 'tabla-turnero' },
        e('thead', null, e('tr', null,
          e('th', null, 'Día'), e('th', null, 'Turno'), e('th', null, 'Asignado'),
          e('th', null, 'Propuesto'), e('th', null, '🔒'))),
        e('tbody', null, claves.map(function (k) {
          const p = data.propuestas[k];
          const cands = p.candidatos || [];
          const cambiado = p.asignadoActual !== p.propuestaSistema;
          return e('tr', {
            key: k,
            title: p.excepcional ? 'Cubierto por un supervisor excepcional: no había nadie con el puesto' : undefined,
            style: (p.conflicto && !p.asignadoActual) ? { background: '#fff1f0' }
              : (p.excepcional ? { background: '#fff8e6' } : null)
          },
            e('td', null, p.dia),
            e('td', null, p.turno, p.excepcional ? e('span', { title: 'por excepción' }, ' ⚠') : null),
            e('td', null,
              e('select', {
                value: p.asignadoActual || '',
                disabled: p.bloqueado,
                onChange: function (ev) { editar(k, { asignadoActual: ev.target.value || null }); }
              },
                e('option', { value: '' }, cands.length ? '— sin asignar —' : '— sin candidatos —'),
                cands.map(function (c) {
                  const vivo = ((base[c.id] || {}).tipo || 0) + cuenta(data.propuestas, c.id);
                  return e('option', { key: c.id, value: c.id },
                    (c.excepcional ? '⚠ ' : '') + c.id +
                    (c.cargo ? ' · ' + c.cargo : '') + ' (' + vivo + '/' + c.limiteMes + ')');
                }),
                // Si el asignado no está entre los candidatos (bloqueado, o
                // guardado en un borrador anterior), que no desaparezca.
                p.asignadoActual && !cands.some(function (c) { return c.id === p.asignadoActual; })
                  && e('option', { value: p.asignadoActual }, p.asignadoActual))),
            e('td', { className: 'muted' }, (p.propuestaSistema || '—') + (cambiado ? ' ✎' : '')),
            e('td', null, e('input', {
              type: 'checkbox', checked: !!p.bloqueado,
              onChange: function (ev) { editar(k, { bloqueado: ev.target.checked }); }
            })));
        }))),
      e('div', { className: 'fila', style: { marginTop: 10 } },
        e('button', { className: 'sec', onClick: recalcular }, '↻ Recalcular'),
        e('button', { className: 'sec', onClick: guardar, disabled: !sucio }, '💾 Guardar borrador'),
        e('button', { className: 'accion', onClick: aplicar }, '✓ Aplicar al turnero'),
        data.borrador && e('button', { className: 'accion no', onClick: descartar }, 'Descartar borrador'))),

    data && e('div', { className: 'tarjeta' },
      e('b', null, 'Acumulados'),
      e('div', { className: 'muted', style: { fontSize: '11px' } },
        e('p', { style: { margin: '2px 0' } },
          e('b', null, 'Marcados'), ' son los servicios del mes con supervisión o instrucción, sumados. ',
          e('b', null, 'Tope'), ' es hasta dónde puede llegar esa suma.'),
        e('p', { style: { margin: '2px 0' } },
          'El convenio pide que al menos 1 de cada 4 servicios se haga como controlador raso (art. 69.2.4), ' +
          'así que el tope son 3 de cada 4 — y cuenta lo mismo una supervisión que una instrucción.'),
        e('p', { style: { margin: '2px 0' } },
          'En rojo, quien ya ha llegado: no se le puede asignar nada más este mes.')),
      e('table', { className: 'tabla-turnero' },
        e('thead', null, e('tr', null,
          e('th', null, 'CTA'), e('th', null, 'Puesto'), e('th', null, 'De este tipo'),
          e('th', null, 'Marcados'), e('th', null, 'Tope'), e('th', null, 'Servicios'), e('th', null, '% anual'))),
        e('tbody', null, Object.keys(data.resumen).sort().map(function (cta) {
          const r = data.resumen[cta];
          const b = base[cta] || { tipo: 0, marcados: 0 };
          const n = cuenta(data.propuestas, cta);
          const supVivo = b.tipo + n, marcVivo = b.marcados + n;
          const alTope = marcVivo >= r.limiteMes;
          return e('tr', { key: cta },
            e('td', null, e('b', null, cta)),
            e('td', { className: r.excepcional ? 'rojo' : 'muted' },
              r.cargo, r.excepcional ? ' ⚠' : ''),
            e('td', null, supVivo),
            e('td', { className: alTope ? 'rojo' : '' }, marcVivo),
            e('td', null, r.limiteMes),
            e('td', null, r.totalMes),
            e('td', { className: 'muted' }, Math.round((r.pctAnual || 0) * 100) + '%'));
        }))))
  );
}

// ── Alumnos e instrucción: se planifica en BORRADOR ────────────────────────
// Nada toca el turnero hasta «Aprobar». Se puede probar, quitar, ajustar,
// guardar y seguir mañana. Antes cada clic escribía en la hoja, así que no
// había forma de planificar — y cualquier fallo de guardado se veía como que
// un día desaparecía, porque cada acción releía todo.
// El mes NO se elige aquí: manda el selector de la cabecera. Ver el comentario
// de `Vista`. Lo que sí es propio de cada panel es cuándo recargar.
function PanelInstruccion(props) {
  const [d, setD] = React.useState(null);
  const [plan, setPlan] = React.useState(null);      // { turnos, parejas }
  const [sel, setSel] = React.useState(null);        // { cta, dia }
  const [cands, setCands] = React.useState(null);    // instructores posibles del día abierto
  const [msg, setMsg] = React.useState(null);
  const mes = props.mes;

  const vacio = { turnos: {}, parejas: {} };
  const cp = (o) => JSON.parse(JSON.stringify(o));

  function cargar(m, recarga) {
    const fn = recarga ? recargarCache : runCache;
    return fn('plan_' + (m || ''), function (r) {
      setD(r);
      // Si hay borrador a medias, se retoma; si no, se parte de lo aplicado.
      const ap = r.aplicado || vacio;
      // ⚠ `||` NO vale aquí: un borrador vacío es `[]` o `{}`, y los dos son
      // truthy, así que ganaban sobre lo aprobado y la lista salía vacía para
      // siempre. Hay que preguntar si EXISTE el borrador, no si «tiene algo».
      setPlan(cp(r.borrador != null ? r.borrador
        : { turnos: ap.turnos || {}, parejas: ap.parejas || {} }));
    }, 'getPlanInstruccion', m || '').catch(function (er) {
      setMsg({ ok: false, txt: String(er && er.message ? er.message : er) });
    });
  }
  React.useEffect(function () { setSel(null); cargar(props.mes); }, [props.mes]);

  if (!d || !plan) {
    return e('div', { className: 'tarjeta', style: { maxWidth: '1400px', margin: '0 auto' } },
      msg ? e('div', { className: 'rojo' }, msg.txt) : e('p', { className: 'muted' }, 'Cargando…'));
  }

  const TURNOS = ['M', 'T', 'V', 'libre'];
  const nombre = (cta) => (d.nombres || {})[cta] || cta;
  const turnoDe = (cta, dia) => (plan.turnos[cta] || {})[dia] || '';
  const franjaDe = (t) => { const x = String(t || '').toUpperCase(); return x.indexOf('T') === 0 ? 'T' : (x.indexOf('M') === 0 ? 'M' : ''); };
  const clavePar = (dia, cta) => dia + '_' + franjaDe(turnoDe(cta, dia)) + '_' + cta;
  const instructorDe = (cta, dia) => plan.parejas[clavePar(dia, cta)] || '';

  // ¿Difiere de lo aplicado? Es lo que decide si hay algo que aprobar.
  const aplicadoPlan = { turnos: (d.aplicado || {}).turnos || {}, parejas: (d.aplicado || {}).parejas || {} };
  const sucio = JSON.stringify(plan) !== JSON.stringify(aplicadoPlan);

  // ── El cupo de cada instructor, contado EN VIVO sobre el borrador ────────
  // Sin esto no se puede repartir a ojo: el reparto automático de instrucción
  // se retiró justamente porque decidía sin saber a quién instruye cada cual,
  // pero lo que sí aportaba —los acumulados y el tope— hacía falta igual.
  const cupos = (d.cupos || {}).instructores || [];
  const cupoDe = {};
  cupos.forEach(function (c) { cupoDe[c.cta] = c; });

  // Las franjas que el BORRADOR le asigna a alguien. Dos alumnos la misma
  // mañana son UN solo Mo, así que se cuentan franjas, no parejas.
  const franjasDe = {};
  Object.keys(plan.parejas).forEach(function (k) {
    const ins = plan.parejas[k];
    if (!ins) return;
    const p = k.split('_');                       // dia_franja_alumno
    if (!franjasDe[ins]) franjasDe[ins] = {};
    franjasDe[ins][p[0] + '_' + p[1]] = true;
  });
  // Lo que le quedaría marcado si se aprobara: lo que ya tiene escrito, menos
  // las instrucciones que el borrador le quita (vuelven a M/T), más las nuevas.
  function previstoDe(cta) {
    const c = cupoDe[cta];
    if (!c) return null;
    const mias = franjasDe[cta] || {};
    let n = c.marcadosMes;
    Object.keys(c.deTipo || {}).forEach(function (k) { if (!mias[k]) n--; });
    Object.keys(mias).forEach(function (k) { if (!(c.marcados || {})[k]) n++; });
    return n;
  }
  const pasado = (cta) => { const c = cupoDe[cta], p = previstoDe(cta); return c && p != null && p > c.limiteMes; };

  function pedirCandidatos(dia, turno) {
    const franja = franjaDe(turno);
    if (!franja) { setCands(null); return; }
    runCache('candinstr_' + mes + '_' + dia + '_' + franja, setCands,
             'getCandidatosInstructor', mes, dia, franja).catch(function () { setCands(null); });
  }
  function abrirDia(nuevo) {
    setSel(nuevo); setCands(null);
    if (nuevo) pedirCandidatos(nuevo.dia, turnoDe(nuevo.cta, nuevo.dia));
  }

  // ── Todo lo que sigue toca SOLO el borrador ─────────────────────────────
  function ponerTurno(cta, dia, turno) {
    const val = (turno === 'libre') ? '' : turno;
    setPlan(function (o) {
      const x = cp(o);
      if (!x.turnos[cta]) x.turnos[cta] = {};
      // Al cambiar de franja o dejarlo libre, la pareja de ese día deja de valer.
      const antes = (o.turnos[cta] || {})[dia] || '';
      const claveAntes = dia + '_' + franjaDe(antes) + '_' + cta;
      if (franjaDe(antes) !== franjaDe(val)) delete x.parejas[claveAntes];
      if (val) x.turnos[cta][dia] = val; else delete x.turnos[cta][dia];
      return x;
    });
    pedirCandidatos(dia, val);
    setMsg(null);
  }
  function ponerInstructor(cta, dia, ins) {
    setPlan(function (o) {
      const x = cp(o);
      const k = dia + '_' + franjaDe((o.turnos[cta] || {})[dia] || '') + '_' + cta;
      if (ins) x.parejas[k] = ins; else delete x.parejas[k];
      return x;
    });
    setMsg(null);
  }

  // ── Y esto es lo único que sale de la pantalla ──────────────────────────
  function guardar() {
    setMsg({ ok: true, txt: 'Guardando el borrador…' });
    run('guardarPlanInstruccion', mes, plan).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo guardar.' }); return; }
      setMsg({ ok: true, txt: '✓ Borrador guardado. El turnero no se ha tocado.' });
    }).catch(function (er) { setMsg({ ok: false, txt: String(er && er.message ? er.message : er) }); });
  }
  function proponer() {
    setMsg({ ok: true, txt: 'Calculando…' });
    run('proponerPlanInstruccion', mes, plan).then(function (r) {
      if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo proponer.' }); return; }
      setPlan(r.plan);
      setMsg({
        ok: true,
        txt: '✓ ' + r.puestas + ' asignadas' +
          (r.sinCandidato ? ' · ' + r.sinCandidato + ' sin nadie que pueda instruir ese día' : '') +
          '. Revísalo: sigue siendo un borrador.'
      });
    }).catch(function (er) { setMsg({ ok: false, txt: String(er && er.message ? er.message : er) }); });
  }
  function descartar() {
    confirmar('Se pierde el borrador y vuelve lo que hay aprobado en el turnero.',
      { titulo: 'Descartar el borrador', ok: 'Descartar', peligro: true }).then(function (si) {
      if (!si) return;
      run('descartarPlanInstruccion', mes).then(function (r) {
        setPlan(cp((r && r.aplicado) || d.aplicado || vacio));
        return cargar(mes, true).then(function () { setMsg({ ok: true, txt: '✓ Borrador descartado.' }); });
      }).catch(function (er) { setMsg({ ok: false, txt: String(er && er.message ? er.message : er) }); });
    });
  }
  function aprobar() {
    const nT = Object.keys(plan.turnos).reduce(function (n, c) { return n + Object.keys(plan.turnos[c] || {}).length; }, 0);
    const nP = Object.keys(plan.parejas).length;
    const fuera = cupos.filter(function (c) { return pasado(c.cta); }).map(function (c) { return c.cta; });
    confirmar('Se escriben en el turnero ' + nT + ' turnos de alumno y ' + nP + ' instrucciones.\n\n' +
      'Los instructores asignados pasarán a Mo/To, y los que dejen de instruir volverán a M/T. ' +
      'Todo queda en el historial y se puede deshacer.' +
      (fuera.length ? '\n\n⚠ Pasan del cupo del mes (art. 69.2.4): ' + fuera.join(', ') + '.' : ''),
      { titulo: 'Aprobar y enviar al turnero', ok: 'Aprobar' }).then(function (si) {
      if (!si) return;
      setMsg({ ok: true, txt: 'Escribiendo en el turnero…' });
      run('aplicarPlanInstruccion', mes, plan).then(function (r) {
        if (!r || r.ok === false) { setMsg({ ok: false, txt: (r && r.error) || 'No se pudo aplicar.' }); return; }
        // El cuadrante ha cambiado: se tira todo lo cacheado que dependa de él.
        ['equipo_', 'global_', 'cal_', 'detalle_', 'candinstr_'].forEach(olvidarPrefijo);
        return cargar(mes, true).then(function () {
          setMsg({ ok: true, txt: '✓ Aprobado: ' + r.turnos + ' turnos, ' + r.parejas + ' instrucciones, ' + r.celdas + ' celdas del cuadrante.' });
        });
      }).catch(function (er) { setMsg({ ok: false, txt: String(er && er.message ? er.message : er) }); });
    });
  }

  // Un instructor no puede estar con dos alumnos a la vez: se marca.
  const choques = {};
  Object.keys(plan.parejas).forEach(function (k) {
    const p = k.split('_');
    const kk = p[0] + '_' + p[1] + '_' + plan.parejas[k];
    choques[kk] = (choques[kk] || 0) + 1;
  });
  const choca = function (cta, dia) {
    const ins = instructorDe(cta, dia);
    if (!ins) return false;
    return choques[dia + '_' + franjaDe(turnoDe(cta, dia)) + '_' + ins] > 1;
  };

  const sinInstructor = Object.keys(plan.turnos).reduce(function (n, cta) {
    return n + Object.keys(plan.turnos[cta] || {}).filter(function (dia) {
      return franjaDe(plan.turnos[cta][dia]) && !instructorDe(cta, dia);
    }).length;
  }, 0);

  return e('div', { className: 'tarjeta', style: { maxWidth: '1400px', margin: '0 auto' } },
    e('h3', { style: { marginTop: 0 } }, '🎓 Instrucción · ' + mes),
    e('p', { className: 'muted', style: { fontSize: '12px' } },
      'Se planifica en ', e('b', null, 'borrador'), ': puedes probar, quitar y ajustar cuantas veces quieras. ',
      e('b', null, 'El turnero no se toca hasta que apruebas'), '.'),
    msg && e('div', { className: msg.ok ? 'verde' : 'rojo', style: { margin: '8px 0' } }, msg.txt),

    e('div', { className: 'fila' },
      d.puedeEditar && e('button', { className: 'sec', onClick: proponer }, '✨ Proponer instructores'),
      d.puedeEditar && e('button', { className: 'sec', disabled: !sucio, onClick: guardar }, '💾 Guardar borrador'),
      d.puedeEditar && e('button', { className: 'accion', disabled: !sucio, onClick: aprobar }, '✓ Aprobar y enviar al turnero'),
      d.puedeEditar && d.borrador && e('button', { className: 'sec', onClick: descartar }, 'Descartar')),

    d.borrador && e('p', { className: 'muted', style: { fontSize: '11px', margin: '4px 0' } },
      '📝 Borrador de ' + (d.borradorAutor || '—') + (d.borradorTs ? ' · ' + String(d.borradorTs).slice(0, 16).replace('T', ' ') : '')),
    sucio
      ? e('p', { className: 'rojo', style: { fontSize: '12px', margin: '4px 0' } },
          '● Hay cambios sin aprobar' + (sinInstructor ? ' · ' + sinInstructor + ' día(s) sin instructor' : '') + '.')
      : e('p', { className: 'verde', style: { fontSize: '12px', margin: '4px 0' } },
          '✓ Lo que ves es lo que hay en el turnero.'),

    // ── El día abierto ────────────────────────────────────────────────────
    sel && d.puedeEditar && (function () {
      const t = turnoDe(sel.cta, sel.dia);
      const ins = instructorDe(sel.cta, sel.dia);
      return e('div', { className: 'tarjeta', style: { marginTop: 10 } },
        e('b', null, nombre(sel.cta) + ' (' + sel.cta + ') · día ' + sel.dia),
        e('div', { className: 'fila', style: { marginTop: 6 } },
          e('span', { className: 'muted', style: { fontSize: '12px' } }, 'Turno:'),
          TURNOS.map(function (x) {
            return e('button', {
              key: x, className: (t === x || (!t && x === 'libre')) ? 'accion' : 'sec',
              onClick: function () { ponerTurno(sel.cta, sel.dia, x); }
            }, x === 'libre' ? 'Libre' : x);
          })),
        t && e('div', { className: 'fila', style: { marginTop: 6 } },
          e('span', { className: 'muted', style: { fontSize: '12px' } }, 'Instructor:'),
          !cands
            ? e('span', { className: 'muted', style: { fontSize: '12px' } }, 'buscando…')
            : cands.candidatos.length === 0
              ? e('span', { className: 'muted', style: { fontSize: '12px' } },
                  'Ese día nadie tiene turno de ' + (cands.franja === 'M' ? 'mañana' : 'tarde') +
                  ' con un puesto que instruya.')
              : e('select', {
                  value: ins,
                  onChange: function (ev) { ponerInstructor(sel.cta, sel.dia, ev.target.value); }
                }, e('option', { value: '' }, '— sin asignar —'),
                   // En el propio selector va el cupo: elegir sabiendo a quién le
                   // toca es la mitad del trabajo, y era ir a otra pantalla.
                   cands.candidatos.map(function (c) {
                     const cu = cupoDe[c.cta];
                     const extra = cu
                       ? ' · ' + previstoDe(c.cta) + '/' + cu.limiteMes + ' del mes · ' + cu.instrAnual + ' al año'
                       : '';
                     return e('option', { key: c.cta, value: c.cta },
                       (pasado(c.cta) ? '⚠ ' : '') + c.nombre + ' (' + c.puesto + ')' + extra);
                   }))),
        t && ins && pasado(ins) && e('p', { className: 'rojo', style: { fontSize: '11px', margin: '4px 0 0' } },
          '⚠ ' + nombre(ins) + ' pasaría del cupo del mes con esta asignación.'),
        !t && e('p', { className: 'muted', style: { fontSize: '11px', margin: '6px 0 0' } },
          'Elige primero el turno del alumno; después podrás asignarle instructor.'),
        e('div', { className: 'fila', style: { marginTop: 6 } },
          e('button', { className: 'sec', onClick: function () { abrirDia(null); } }, 'Cerrar')));
    })(),

    // ── La planilla ───────────────────────────────────────────────────────
    e('div', { style: { marginTop: 12 } },
      e('b', { style: { fontSize: '13px' } }, 'Planilla de alumnos'),
      e('p', { className: 'muted', style: { fontSize: '11px', margin: '2px 0 4px' } },
        'Cada celda: el turno y, debajo, el instructor. Pulsa para cambiarlo.'),
      d.alumnos.length === 0
        ? e('p', { className: 'muted', style: { fontSize: '12px' } },
            'Ningún alumno. Se les asigna el puesto ALUMNO en Configuración → Controladores y cargos.')
        : e('div', { className: 'turnero-caja' },
            e('table', { className: 'tabla-turnero' },
              e('thead', null, e('tr', null,
                e('th', { className: 'col-cta' }, 'CTA'),
                d.dias.map(function (dia) { return e('th', { key: dia }, dia); }))),
              e('tbody', null, d.alumnos.map(function (a) {
                return e('tr', { key: a.cta },
                  e('td', { className: 'col-cta', title: a.nombre }, a.cta),
                  d.dias.map(function (dia) {
                    const t = turnoDe(a.cta, dia);
                    const ins = instructorDe(a.cta, dia);
                    const abierto = sel && sel.cta === a.cta && sel.dia === dia;
                    return e('td', {
